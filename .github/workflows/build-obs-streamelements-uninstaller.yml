name: Build

permissions:
  contents: read
  id-token: write    # lets the job mint a GitHub OIDC token for WIF

on:
  workflow_call:
    secrets:
      AZURE_TENANT_ID:
        required: true
      AZURE_CLIENT_ID:
        required: true
      AZURE_CLIENT_SECRET:
        required: true

env:
  ROOT: ${{ github.workspace }}\CI\obs-streamelements-uninstaller

  SIGN_BINARIES: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  UPLOAD_BINARIES: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

jobs:
  build-uninstaller-windows:
    runs-on: windows-2022

    steps:
      - name: Debug
        shell: cmd
        run: |
          echo "${{ github.event.repository.updated_at }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Install Chocolatey packages
        shell: cmd
        run: |
          choco install -y archiver
          choco install -y nsis --version=3.03 --force

      - name: Download resources
        shell: cmd
        run: |
          cd /d "${{ env.ROOT }}"

          if not exist resources mkdir resources

          curl -L https://storage.googleapis.com/cdn.streamelements.com/obs/dist/obs-probe-libobs-version/windows/qa/obs-probe-libobs-version-32.exe --output resources\obs-probe-libobs-version-32.exe
          curl -L https://storage.googleapis.com/cdn.streamelements.com/obs/dist/obs-probe-libobs-version/windows/qa/obs-probe-libobs-version-64.exe --output resources\obs-probe-libobs-version-64.exe

      - name: Install NSIS plugins
        uses: ./.github/actions/install-nsis-plugins
        with:
          working-directory: ${{ env.ROOT }}

      - name: Build installer
        shell: cmd
        run: |
          cd /d "${{ env.ROOT }}"

          makensis /V4 main.nsi

      - name: Sign Windows binaries
        uses: azure/artifact-signing-action@v2
        if: ${{ env.SIGN_BINARIES }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: SE-Live
          certificate-profile-name: SE-Live
          files-folder: '${{ env.ROOT }}'
          files-folder-filter: exe,dll,msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

# Automatically finds signtool.exe and exposes its path
      - name: Find SignTool
        if: ${{ env.SIGN_BINARIES }}
        uses: KamaranL/add-signtool-action@v1
        id: signtool

      - name: Verify Windows binaries code signature
        if: ${{ env.SIGN_BINARIES }}
        shell: cmd
        run: |
          signtool verify /pa /v "${{ env.ROOT }}\\obs-streamelements-uninstaller.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: uninstaller
          path: obs-streamelements-uninstaller.exe

      - name: Upload to Google Artifact Storage
        if: ${{ env.UPLOAD_BINARIES }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ env.ROOT }}/obs-streamelements-uninstaller.exe'
          destination: 'se-obs-builds/obs-streamelements-uninstaller/latest/windows'

      - name: Upload to CDN Signed Artifact Storage
        if: ${{ env.UPLOAD_BINARIES }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ env.ROOT }}/obs-streamelements-uninstaller.exe'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements-uninstaller/windows/signed'

      - name: Upload to CDN QA Artifact Storage
        if: ${{ env.UPLOAD_BINARIES }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ env.ROOT }}/obs-streamelements-uninstaller.exe'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements-uninstaller/windows/qa'

      - name: Upload to CDN Latest Artifact Storage
        if: ${{ env.UPLOAD_BINARIES }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ env.ROOT }}/obs-streamelements-uninstaller.exe'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements-uninstaller/windows/latest'
