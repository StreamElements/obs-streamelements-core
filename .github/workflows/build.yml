name: Build

concurrency:
  group: ${{ github.workflow }}-${{ case(startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]'), 'automation', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]') }}
permissions:
  contents: write    # lets GITHUB_TOKEN push tags
  id-token: write    # lets the job mint a GitHub OIDC token for WIF
on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  BASE_BUILD_NUMBER: 569

  BUILD_OPTIONS: >
    -DENABLE_DECKLINK=OFF
    -DENABLE_SYPHON=OFF
    -DENABLE_LIBFDK=OFF
    -DENABLE_NVENC=OFF
    -DENABLE_QSV11=OFF
    -DENABLE_VST=OFF
    -DENABLE_WEBRTC=OFF
    -DENABLE_WEBSOCKET=OFF
    -DENABLE_OSS=OFF
    -DENABLE_SNDIO=OFF
    -DENABLE_VLC=OFF
    -DENABLE_VIRTUALCAM=OFF
    -DENABLE_TEST_INPUT=OFF
    -DENABLE_AJA=OFF
    -DENABLE_SCRIPTING=OFF
    -DENABLE_SCRIPTING_LUA=OFF
    -DENABLE_UI=OFF

  BUILD_UNINSTALLER: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  BUILD_INSTALLER: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  UPLOAD_SYMBOLS: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  UPLOAD_BINARIES: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_encoded: ${{ steps.version_step.outputs.version_encoded }}
      version_string: ${{ steps.version_step.outputs.version_string }}
      is_workflow_automation: ${{ steps.is_workflow_automation_step.outputs.is_workflow_automation }}
      has_release_notes: ${{ steps.has_release_notes_step.outputs.has_release_notes }}

    steps:
      - name: Generate build number
        uses: mlilback/build-number@v1
        with:
          base: ${{ env.BASE_BUILD_NUMBER }}
          run-id: ${{ github.run_number }}
          # Output: ${{ env.BUILD_NUMBER }} env var

      - name: Generate Version
        id: version_step
        run: |
          echo "BUILD_NUMBER=${{ env.BUILD_NUMBER }}"

          VERSION_ENCODED="$(date '+%Y%m%d')$(printf '%06d' ${{ env.BUILD_NUMBER }})"
          VERSION_STRING="$(date '+%y.%-m.%-d')$(printf '.%d' ${{ env.BUILD_NUMBER }})"

          echo "version_encoded=$VERSION_ENCODED" >> $GITHUB_OUTPUT
          echo "version_string=$VERSION_STRING" >> $GITHUB_OUTPUT

      - name: Check if last commit is result of workflow automation
        id: is_workflow_automation_step
        run: |
          IS_WORKFLOW_AUTOMATION=${{ startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]') }}

          echo "IS_WORKFLOW_AUTOMATION=$IS_WORKFLOW_AUTOMATION"

          echo "is_workflow_automation=$IS_WORKFLOW_AUTOMATION" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - name: Check if RELEASE_NOTES.md has content
        id: has_release_notes_step
        run: |
          if [[ $(grep -c "" RELEASE_NOTES.md) -eq 0 ]]; then
            echo "has_release_notes=false"

            echo "has_release_notes=false" >> $GITHUB_OUTPUT
          else
            echo "has_release_notes=true"

            echo "has_release_notes=true" >> $GITHUB_OUTPUT
          fi

  # The Claude-written "What's New" blurb, generated once and consumed twice: the
  # in-app updater reads it out of the manifest (via build-installer), and the
  # GitHub prerelease body reads it in finalize.
  #
  # It is its own job because of ordering. build-installer composes the manifests and
  # runs *before* finalize, so a blurb generated in finalize does not exist yet when
  # the manifest is built. Generating it in both places instead would mean two model
  # calls whose output can differ -- and the point is that a creator reads the same
  # words in the updater and on the release page.
  #
  # Needs no build artifacts: the prompt reads RELEASE_NOTES.md and a changelog
  # computed from git history, both available immediately after `version`.
  summary:
    needs: version
    if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      # Base64 so a multi-line blurb survives as a job output, and so model text never
      # passes through GitHub expression interpolation as shell.
      whats_new_base64: ${{ steps.encode.outputs.whats_new_base64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog is `git log <previous full release>..<head>`.
          fetch-depth: 0
          filter: blob:none

      - name: Resolve previous full release
        id: prevtag
        uses: ./.github/actions/se-release
        with:
          mode: prevtag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.version_string }}
          version-encoded: ${{ needs.version.outputs.version_encoded }}

      - name: Build changelog
        uses: ./.github/actions/se-release
        with:
          mode: changelog
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.version_string }}
          previous-tag: ${{ steps.prevtag.outputs.previous_tag }}
          head-ref: ${{ github.sha }}
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md

      - name: Generate release summary with Claude
        id: claude_summary
        # Optional by construction: on failure or timeout the encode step yields an
        # empty output, the manifest keeps only its notes, and the prerelease is
        # composed from notes + changelog.
        continue-on-error: true
        timeout-minutes: 10
        # The base action, NOT anthropics/claude-code-action. The wrapper parses the
        # GitHub event context and rejects anything it does not recognise -- here it
        # fails immediately with "Unsupported event type: push". The base action has no
        # such gate. Pinned exactly: it publishes no moving major tag.
        uses: anthropics/claude-code-base-action@v0.0.63
        # Force Task subagents to run in the foreground; same rationale as
        # claude-code-review.yml. Upstream: anthropics/claude-code-action#1499.
        env:
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: '1'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Write the "What's New" section for SE.Live (the StreamElements OBS plugin)
            release ${{ needs.version.outputs.version_string }}.

            The audience is creators -- people who stream and record with OBS. They are
            not developers and do not know this codebase. Write about what they will
            notice: what works better, what is new, what no longer breaks.

            Read these files, relative to the repository root:
              - RELEASE_NOTES.md               release notes written by the team
              - .release-input/changelog.md    PRs merged since the last release

            Write 2-4 sentences, or up to 4 short bullets.

            Rules:
            - Use only what is in those files. Invent nothing.
            - Do not restate the notes verbatim; they are published directly below your
              text under a "Release Notes" heading.
            - Skip CI, build-system, refactor and dependency work entirely -- none of it
              is visible to a creator.
            - Avoid internal jargon: say "scene switching" rather than naming a class,
              and describe an effect rather than a code path.
            - No heading: the workflow adds "What's New" itself.
            - Plain Markdown, no code fences.

            Reply with the blurb text and nothing else -- no preamble, no JSON, no
            explanation of what you did. Your entire reply is published verbatim.
          # v0.0.63's real inputs. `claude_args` belongs to a newer interface that
          # exists only on the action's main branch; passing it to this tag logs
          # "Unexpected input(s)" and drops it, which is how earlier attempts silently
          # ran on the action's retired default model and 404'd. `model` must be its own
          # input.
          model: claude-opus-5
          allowed_tools: Read,Glob,Grep
          timeout_minutes: '10'

      # v0.0.63 exposes only `conclusion` and `execution_file` -- there is no
      # `structured_output`, so the blurb is recovered from the transcript.
      - name: Extract and encode release summary
        id: encode
        continue-on-error: true
        run: |
          set -eu
          SUMMARY="${{ github.workspace }}/.release-input/summary.txt"

          node .github/actions/se-release/extract-summary.js \
            "${{ steps.claude_summary.outputs.execution_file }}" "$SUMMARY" || true

          if [ -s "$SUMMARY" ]; then
            echo "whats_new_base64=$(base64 --wrap=0 "$SUMMARY")" >> "$GITHUB_OUTPUT"
            echo "::notice::What's New summary generated ($(wc -c < "$SUMMARY") bytes)"
          else
            echo "whats_new_base64=" >> "$GITHUB_OUTPUT"
            echo "::warning::no What's New summary was produced; the manifest and release will carry release notes only"
          fi

  windows:
    needs: version
    runs-on: windows-2022
    if: needs.version.outputs.is_workflow_automation != 'true'

    env:
      CHECKOUT: 31.1.2
      GS_ACCESS_KEY_ID: ${{ secrets.GS_ACCESS_KEY_ID }}
      GS_KEY_BASE64: ${{ secrets.GS_KEY_BASE64 }}
      GITHUB_WORKSPACE: $GITHUB_WORKSPACE

    steps:
      - uses: actions/checkout@v4

      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Clone OBS Studio
        shell: cmd
        run: |
          mkdir C:\local
          git clone --recursive https://github.com/obsproject/obs-studio.git C:\local\obs-studio
          cd /d C:\local\obs-studio
          git checkout %CHECKOUT%

      - name: Install plugin into OBS tree
        shell: cmd
        run: |
          mkdir C:\local\obs-studio\plugins\obs-streamelements-core
          xcopy "%GITHUB_WORKSPACE%\*.*" "C:\local\obs-studio\plugins\obs-streamelements-core" /S /E /I /Y
          echo add_obs_plugin(obs-streamelements-core) > C:\local\obs-studio\plugins\CMakeLists.txt

      - name: Setup GCS uploader
        shell: powershell
        run: |
          cd C:\local\obs-studio\plugins\obs-streamelements-core\CI\gcs
          [System.Text.Encoding]::UTF8.GetString(
            [System.Convert]::FromBase64String($env:GS_KEY_BASE64)
          ) | Out-File key.json
          npm install

      # Symbol upload is best-effort: BugSplat being unreachable must not fail a build
      # that otherwise compiled and signed correctly. The only consequence is that crash
      # reports for this build are not symbolicated. BugSplat is slated to be replaced by
      # Sentry, so this path is deliberately tolerant rather than hardened.
      - name: Download BugSplat uploader
        shell: pwsh
        run: |
          mkdir c:\local\bugsplat

          c:

          cd c:\local\bugsplat

          curl.exe -sL -f -O https://github.com/BugSplat-Git/symbol-upload/releases/download/v10.5.0/symbol-upload-windows.exe

          if ($LASTEXITCODE -ne 0) {
            Write-Host "::warning title=BugSplat uploader unavailable::Could not download symbol-upload-windows.exe (curl exit $LASTEXITCODE). Windows symbols will not be uploaded for this build and its crash reports will not be symbolicated."
          }

          exit 0

      - name: Generate Version
        shell: powershell
        run: |
          "#define STREAMELEMENTS_PLUGIN_VERSION ${{ needs.version.outputs.version_encoded }}" |
            Out-File C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp

          type C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp

          "STREAMELEMENTS_PLUGIN_VERSION=${{ needs.version.outputs.version_string }}" |
            Out-File $env:GITHUB_ENV -Append

      - name: Configure
        shell: cmd
        run: |
          copy C:\local\obs-studio\plugins\obs-streamelements-core\CMakeUserPresets.json C:\local\obs-studio\CMakeUserPresets.json
          del C:\local\obs-studio\plugins\obs-streamelements-core\CMakeUserPresets.json
          cd /d C:\local\obs-studio
          cmake --preset=windows-x64-streamelements %BUILD_OPTIONS%

      - name: Build
        shell: cmd
        run: |
          cd /d C:\local\obs-studio\build_x64
          msbuild obs-studio.sln -p:Configuration=RelWithDebInfo

      - name: Upload BugSplat Symbols
        if: ${{ env.UPLOAD_SYMBOLS == 'true' }}
        shell: cmd
        run: |
          c:\local\bugsplat\symbol-upload-windows.exe ^
            -v ^
            --clientId "${{ secrets.BUGSPLAT_CLIENTID }}" ^
            --clientSecret "${{ secrets.BUGSPLAT_CLIENTSECRET }}" ^
            --application obs-streamelements-core ^
            --version "${{ needs.version.outputs.version_string }}" ^
            --database OBS_Live ^
            --directory "C:\local\obs-studio\build_x64\rundir\RelWithDebInfo\obs-plugins\64bit" ^
            --files obs-streamelements*.pdb

          rem Captured on its own line: %ERRORLEVEL% inside an if-block would expand at
          rem parse time, before the exe has run, because delayed expansion is off.
          set "RC=%ERRORLEVEL%"

          if not "%RC%"=="0" echo ::warning title=BugSplat symbol upload failed::symbol-upload-windows.exe exited with %RC%. Windows crash reports for ${{ needs.version.outputs.version_string }} will not be symbolicated. The build itself is unaffected.

          exit /b 0

      - name: Package
        shell: cmd
        run: |
          cd /d C:\local\obs-studio\build_x64\rundir\RelWithDebInfo
          7z a "${{ github.workspace }}/build64_qt6.zip" .

          copy /y C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp "${{ github.workspace }}/Version.generated.hpp"

      - uses: actions/upload-artifact@v4
        with:
          name: build64
          path: '${{ github.workspace }}/build64_qt6.zip'

      - name: Upload 64bit build artifact to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/build64_qt6.zip'
          destination: 'se-obs-builds/obs-streamelements-core/latest/windows'

      - name: Upload version header to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/Version.generated.hpp'
          destination: 'se-obs-builds/obs-streamelements-core/latest/windows'

  macos:
    needs: version
    runs-on: macos-15
    if: needs.version.outputs.is_workflow_automation != 'true'

    env:
      CHECKOUT: 31.1.2
      GS_SECRET_ACCESS_KEY: ${{ secrets.GS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Clone OBS Studio
        run: |
          git clone --recursive https://github.com/obsproject/obs-studio.git ~/src/obs-studio
          cd ~/src/obs-studio
          git checkout $CHECKOUT

      - name: Install plugin
        run: |
          cp -R "$GITHUB_WORKSPACE" ~/src/obs-studio/plugins/obs-streamelements-core
          echo "add_obs_plugin(obs-streamelements-core)" >> ~/src/obs-studio/plugins/CMakeLists.txt

      - name: Prepare bugsplat Framework # we store it as a ZIP since on Windows the resulting paths of the unpacked archive are just way too long
        run: |
          cd ~/src/obs-studio/plugins/obs-streamelements-core/deps

          unzip BugSplat.xcframework.zip

      # Best-effort, as on Windows: a BugSplat outage must not fail an otherwise good
      # build. chmod moved inside the success branch -- it would fail on a missing file
      # and take the step down with it.
      - name: Download BugSplat uploader
        run: |
          cd /tmp
          if curl -sL -f -O https://github.com/BugSplat-Git/symbol-upload/releases/download/v10.5.0/symbol-upload-macos; then
            #cp symbol-upload-macos-intel symbol-upload-macos
            chmod +x symbol-upload-macos
          else
            echo "::warning title=BugSplat uploader unavailable::Could not download symbol-upload-macos. macOS symbols will not be uploaded for this build and its crash reports will not be symbolicated."
          fi

      - name: Generate Version
        run: |
          echo "#define STREAMELEMENTS_PLUGIN_VERSION ${{ needs.version.outputs.version_encoded }}" \
            > ~/src/obs-studio/plugins/obs-streamelements-core/streamelements/Version.generated.hpp

          cat ~/src/obs-studio/plugins/obs-streamelements-core/streamelements/Version.generated.hpp

      - name: Build ARM64
        id: build-arm64
        run: |
          cd ~/src/obs-studio
          cmake --preset=macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -B build_macos_arm64 \
            $BUILD_OPTIONS

          cd build_macos_arm64

          xcodebuild \
            -configuration RelWithDebInfo \
            -scheme obs-streamelements-core \
            -destination "generic/platform=macOS,name=Any Mac"

          cd ~/src/obs-studio/build_macos_arm64/plugins/obs-streamelements-core/RelWithDebInfo

          xcrun dsymutil obs-streamelements-core.plugin/Contents/MacOS/obs-streamelements-core -o obs-streamelements-core.dSYM

      - name: Build x86_64
        id: build-x86_64
        run: |
          cd ~/src/obs-studio
          cmake --preset=macos \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -B build_macos_x86_64 \
            $BUILD_OPTIONS

          cd build_macos_x86_64
          xcodebuild \
            -configuration RelWithDebInfo \
            -scheme obs-streamelements-core \
            -destination "generic/platform=macOS,name=Any Mac"

          cd ~/src/obs-studio/build_macos_x86_64/plugins/obs-streamelements-core/RelWithDebInfo

          xcrun dsymutil obs-streamelements-core.plugin/Contents/MacOS/obs-streamelements-core -o obs-streamelements-core.dSYM

      # The subshell covers the cd as well as the upload: a missing build directory would
      # otherwise fail the step before the uploader ever ran.
      - name: Upload ARM64 to BugSplat
        if: env.UPLOAD_SYMBOLS == 'true'
        run: |
          if ! (
            cd ~/src/obs-studio/build_macos_arm64/plugins/obs-streamelements-core/RelWithDebInfo &&
            /tmp/symbol-upload-macos -v -a "obs-streamelements-core-macos" -b "OBS_Live" -i "${{ secrets.BUGSPLAT_CLIENTID }}" -s "${{ secrets.BUGSPLAT_CLIENTSECRET }}" -f "obs-streamelements-core.dSYM" -d . -v "${{ needs.version.outputs.version_encoded }}"
          ); then
            echo "::warning title=BugSplat symbol upload failed (macOS arm64)::arm64 symbols for ${{ needs.version.outputs.version_string }} were not uploaded, so its crash reports will not be symbolicated. The build itself is unaffected."
          fi

      - name: Upload x86_64 to BugSplat
        if: env.UPLOAD_SYMBOLS == 'true'
        run: |
          if ! (
            cd ~/src/obs-studio/build_macos_x86_64/plugins/obs-streamelements-core/RelWithDebInfo &&
            /tmp/symbol-upload-macos -v -a "obs-streamelements-core-macos" -b "OBS_Live" -i "${{ secrets.BUGSPLAT_CLIENTID }}" -s "${{ secrets.BUGSPLAT_CLIENTSECRET }}" -f "obs-streamelements-core.dSYM" -d . -v "${{ needs.version.outputs.version_encoded }}"
          ); then
            echo "::warning title=BugSplat symbol upload failed (macOS x86_64)::x86_64 symbols for ${{ needs.version.outputs.version_string }} were not uploaded, so its crash reports will not be symbolicated. The build itself is unaffected."
          fi
      - name: Package
        run: |
          cd ~/src/obs-studio/build_macos_arm64/plugins/obs-streamelements-core/RelWithDebInfo
          7z a '${{ github.workspace }}/build_arm64.zip' .

          cd ~/src/obs-studio/build_macos_x86_64/plugins/obs-streamelements-core/RelWithDebInfo
          7z a '${{ github.workspace }}/build_x86_64.zip' .

          cp ~/src/obs-studio/plugins/obs-streamelements-core/streamelements/Version.generated.hpp '${{ github.workspace }}/Version.generated.hpp'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            build_arm64.zip
            build_x86_64.zip

      - name: Upload ARM64 build artifact to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/build_arm64.zip'
          destination: 'se-obs-builds/obs-streamelements-core/latest/macos'

      - name: Upload x86_64 build artifact to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/build_x86_64.zip'
          destination: 'se-obs-builds/obs-streamelements-core/latest/macos'

      - name: Upload version header to GCS
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/Version.generated.hpp'
          destination: 'se-obs-builds/obs-streamelements-core/latest/macos'

  build-uninstaller:
    needs: [ version ]
    if: needs.version.outputs.is_workflow_automation != 'true'
    permissions:
      contents: read
      id-token: write # lets the job mint a GitHub OIDC token for WIF
    uses: ./.github/workflows/build-obs-streamelements-uninstaller.yml
    secrets: inherit
  build-installer:
    # `summary` is a dependency so the blurb reaches the manifest, but always() keeps
    # the installer building when summary was skipped (no release notes) or failed.
    # Release prose must never be able to stop a build shipping.
    needs: [ version, build-uninstaller, windows, macos, summary ]
    if: always() && needs.version.outputs.is_workflow_automation != 'true' &&
        needs.build-uninstaller.result == 'success' &&
        needs.windows.result == 'success' && needs.macos.result == 'success'
    permissions:
      contents: read
      id-token: write # lets the job mint a GitHub OIDC token for WIF
    uses: ./.github/workflows/build-obs-streamelements-installer.yml
    secrets: inherit
    with:
      SKIP_WINDOWS_SIGNING: ${{ vars.SKIP_WINDOWS_SIGNING }}
      SKIP_APPLE_SIGNING_AND_NOTARIZATION: ${{ vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION }}
      PLUGIN_VERSION_STRING: ${{ needs.version.outputs.version_string }}
      PLUGIN_VERSION_ENCODED: ${{ needs.version.outputs.version_encoded }}
      # Empty when summary was skipped or failed; release_notes then composes the
      # manifest exactly as it did before.
      WHATS_NEW_BASE64: ${{ needs.summary.outputs.whats_new_base64 }}

  deploy-signed-windows:
    needs: [ version, windows, build-installer ]
    runs-on: ubuntu-latest
    # has_release_notes gates this whole job: a build with an empty RELEASE_NOTES.md must
    # put nothing new on signed/ -- no binaries, no manifest, no version SVG. Such a build
    # gets no tag and no GitHub release either, so publishing it would advance the channel
    # to a version that can never be promoted to `latest` (the promotion fails by design)
    # and would leave signed/ serving a manifest whose release notes belong to an earlier
    # build.
    if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (vars.SKIP_WINDOWS_SIGNING != 'true' && vars.SKIP_WINDOWS_SIGNING != '1' && vars.SKIP_WINDOWS_SIGNING != 'yes')

    steps:
      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Create Custom Status Badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: 'Version'
          status: '${{ needs.version.outputs.version_string }}'
          color: 'blue'
          style: 'flat'
          path: '${{ github.workspace }}/version-badge.svg' # Saves the badge image inside your workspace          

      - name: Prepare files
        run: |
          export signedPackageFilename=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}
          export signedPackageFilename64=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}-64bit
          export signedPackageFilename32=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}
          export manifestTs=${{ needs.version.outputs.version_encoded }}

          for manifest in obs-streamelements.manifest obs-streamelements.qa.manifest obs-streamelements.beta.manifest obs-streamelements.latest.manifest obs-streamelements.stable.manifest
          do
            curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/$manifest --output $manifest

            sed -i "s/\${PACKAGE_FILENAME}/$signedPackageFilename/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_64_BIT}/$signedPackageFilename64/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_32_BIT}/$signedPackageFilename32/" $manifest

            # Cache-buster, appended once the URLs are final. It matters most on
            # `stable`, whose installer filename carries no version -- without it a CDN
            # or client cache can keep serving the previous build from an unchanged URL.
            # Keyed to the build rather than the clock so the same build always yields
            # the same URL and stays cacheable. Only package_url* lines are touched, and
            # only those that don't already carry a query string.
            sed -i -E "s#^(package_url[a-z0-9_]*=[^?[:space:]]+)(\r?)\$#\1?ts=$manifestTs\2#" $manifest

            cat $manifest
          done

          cp obs-streamelements.manifest obs-streamelements-${{ needs.version.outputs.version_encoded }}.manifest

          curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/obs-streamelements-setup.exe --output obs-streamelements-setup.exe
          curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/obs-streamelements-setup-x64.exe --output obs-streamelements-setup-x64.exe
          # curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/obs-streamelements-setup-x86.exe --output obs-streamelements-setup-x86.exe

          cp obs-streamelements-setup-x64.exe ${signedPackageFilename64}.exe
          cp obs-streamelements-setup-x64.exe ${signedPackageFilename32}.exe # This is not a mistake, we no longer support 32bit builds
          mv obs-streamelements-setup.exe ${signedPackageFilename}.exe

          cp version-badge.svg obs-streamelements.version.svg
          cp version-badge.svg obs-streamelements.signed.version.svg
          cp version-badge.svg obs-streamelements.qa.version.svg
          cp version-badge.svg obs-streamelements.beta.version.svg
          cp version-badge.svg obs-streamelements.latest.version.svg
          cp version-badge.svg obs-streamelements.stable.version.svg

          ls *.exe
          ls *.manifest

      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed-installer
          path: |
            *.exe
            *.manifest
            *.version.svg
            *.*.version.svg

      - name: Upload Binaries to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '{*.exe,obs-streamelements.version.svg,obs-streamelements.*.version.svg}'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed'

      - name: Upload Manifests to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '*.manifest'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed'
          headers: |
            content-type: text/plain; charset=utf-8

      - name: Upload signed installers to VirusTotal Monitor
        uses: StreamElements/virustotal-monitor-action@v1
        with:
          # The action has no default and reads no environment variable — the key is always passed
          # in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: upload
          version: ${{ needs.version.outputs.version_encoded }}
          path-prefix: /obs-streamelements-core/windows
          files: |
            ${{ github.workspace }}/obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}.exe
            ${{ github.workspace }}/obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}-64bit.exe
          # Upload failures are loud: a release that AV vendors never see is the problem this solves.
          on-error: fail
          verbose: true

  deploy-signed-macos:
    needs: [ version, macos, build-installer ]
    runs-on: ubuntu-latest
    # Gated on has_release_notes for the same reason as deploy-signed-windows above.
    if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION != 'true' && vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION != '1' && vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION != 'yes')

    steps:
      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Create Custom Status Badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: 'Version'
          status: '${{ needs.version.outputs.version_string }}'
          color: 'blue'
          style: 'flat'
          path: '${{ github.workspace }}/version-badge.svg' # Saves the badge image inside your workspace          

      - name: Prepare files
        run: |
          export signedPackageFilename=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}
          export manifestTs=${{ needs.version.outputs.version_encoded }}

          for manifest in obs-streamelements.manifest obs-streamelements.qa.manifest obs-streamelements.beta.manifest obs-streamelements.latest.manifest obs-streamelements.stable.manifest
          do
            echo "Downloading manifest '$manifest' ..."

            curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/macos/$manifest --output $manifest

            sed -i "s/\${PACKAGE_FILENAME}/$signedPackageFilename/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_64_BIT}/$signedPackageFilename/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_32_BIT}/$signedPackageFilename/" $manifest

            # Cache-buster; see the matching comment in deploy-signed-windows.
            sed -i -E "s#^(package_url[a-z0-9_]*=[^?[:space:]]+)(\r?)\$#\1?ts=$manifestTs\2#" $manifest

            cat $manifest
          done

          cp obs-streamelements.manifest obs-streamelements-${{ needs.version.outputs.version_encoded }}.manifest

          curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/macos/obs-streamelements-core.pkg --output ${signedPackageFilename}.pkg

          cp version-badge.svg obs-streamelements.version.svg
          cp version-badge.svg obs-streamelements.signed.version.svg
          cp version-badge.svg obs-streamelements.qa.version.svg
          cp version-badge.svg obs-streamelements.beta.version.svg
          cp version-badge.svg obs-streamelements.latest.version.svg
          cp version-badge.svg obs-streamelements.stable.version.svg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-installer
          path: |
            *.pkg
            *.manifest
          
      - name: Upload Binaries to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '{*.pkg,obs-streamelements.version.svg,obs-streamelements.*.version.svg}'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/macos/signed'

      - name: Upload Manifests to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '*.manifest'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/macos/signed'
          headers: |
            content-type: text/plain; charset=utf-8

  finalize:
    # Note this job is now skipped entirely for a build with an empty RELEASE_NOTES.md:
    # it needs deploy-signed-*, those are gated on has_release_notes, and GitHub skips a
    # job whose dependencies were skipped. That is the intended outcome -- every step
    # below is already individually gated on has_release_notes, with one exception, the
    # VirusTotal prune. Losing the prune on notes-less builds is consistent rather than a
    # gap: the matching VirusTotal upload lives in deploy-signed-windows and is skipped
    # too, so no new files were submitted, and release.yml prunes again on every
    # non-dry-run promotion. The same implicit skip already happens when
    # SKIP_WINDOWS_SIGNING or SKIP_APPLE_SIGNING_AND_NOTARIZATION is set.
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [version, windows, macos, build-uninstaller, build-installer, deploy-signed-macos, deploy-signed-windows, summary]
    runs-on: ubuntu-latest

    steps:
      - name: Tag master commit
        uses: tvdias/github-tagger@v0.0.1
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ needs.version.outputs.version_string }}"

      - uses: actions/checkout@v4
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        with:
          ssh-key: ${{ secrets.RELEASE_BOT_SSH_KEY }}
          # The prerelease changelog is `git log <previous full release>..<sha>`, which
          # needs the whole history and every tag. blob:none keeps it cheap: git log
          # never reads file contents, and this repo's .git is ~120 MB.
          fetch-depth: 0
          filter: blob:none

      # The four steps below must stay between the checkout above (which puts
      # RELEASE_NOTES.md on disk) and "Clear RELEASE_NOTES.md" below (which truncates it
      # and pushes the truncation). This is the last point at which the notes for this
      # build exist anywhere.
      - name: Resolve previous full release
        id: prevtag
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: prevtag
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.version_string }}
          version-encoded: ${{ needs.version.outputs.version_encoded }}

      - name: Build changelog
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: changelog
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.version_string }}
          previous-tag: ${{ steps.prevtag.outputs.previous_tag }}
          # Walk to the built commit rather than the tag: the tagger step ran seconds ago
          # and the tag may not have reached this clone yet.
          head-ref: ${{ github.sha }}
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md

      # The blurb is not generated here. It comes from the `summary` job, which runs
      # early enough for build-installer to bake the same text into the manifests, so
      # the in-app updater and the release page cannot disagree. Decoding it into the
      # file the prerelease step already reads leaves that step unchanged.
      - name: Decode release summary
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        continue-on-error: true
        env:
          # Model-authored text: passed as an environment variable and decoded, never
          # interpolated into the script body.
          WHATS_NEW_BASE64: ${{ needs.summary.outputs.whats_new_base64 }}
        run: |
          set -eu
          mkdir -p "${{ github.workspace }}/.release-input"

          if [ -n "${WHATS_NEW_BASE64:-}" ]; then
            echo "$WHATS_NEW_BASE64" | base64 -d > "${{ github.workspace }}/.release-input/summary.txt"
            echo "::notice::reusing the What's New summary from the summary job"
          else
            : > "${{ github.workspace }}/.release-input/summary.txt"
            echo "::warning::no What's New summary was produced; composing from notes and changelog only"
          fi

      - name: Create GitHub prerelease
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: prerelease
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.version_string }}
          notes-file: RELEASE_NOTES.md
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md
          # Also makes the step write obs-streamelements.release_notes.md here, for the
          # CDN upload below.
          output-dir: ${{ github.workspace }}/.release-input
          # Absent or empty whenever generation failed; the body is then composed from
          # notes + changelog alone.
          summary-file: ${{ github.workspace }}/.release-input/summary.txt
          dry-run: 'false'

      # Attach the signed installers. Runs after the release exists and after
      # deploy-signed-* has published them, reading the URLs from the manifest rather
      # than rebuilding them from the version -- the manifest is the contract the
      # in-app updater already follows, so the release ships exactly what it points at.
      # Best-effort: a failure here leaves the release valid, just without binaries.
      - name: Attach installers to the release
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        continue-on-error: true
        uses: ./.github/actions/se-release
        with:
          mode: assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.version.outputs.version_string }}
          version-encoded: ${{ needs.version.outputs.version_encoded }}
          dry-run: 'false'

      # Publish the blurb + notes next to the manifest in signed/, so promotion can reuse
      # the text instead of regenerating it, and so the notes for a given build follow
      # that build through the channels. Uploaded here rather than from deploy-signed-*
      # because the blurb does not exist until the step above has run.
      - name: Auth Google API
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Upload release notes to windows/signed
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}/.release-input
          glob: 'obs-streamelements.release_notes.md'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed'
          headers: |
            content-type: text/markdown; charset=utf-8
            cache-control: 'public, max-age=60'

      - name: Upload release notes to macos/signed
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}/.release-input
          glob: 'obs-streamelements.release_notes.md'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/macos/signed'
          headers: |
            content-type: text/markdown; charset=utf-8
            cache-control: 'public, max-age=60'

      - name: Clear RELEASE_NOTES.md
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        run: |
          git config --global user.email "release-bot@obs-streamelements-core"
          git config --global user.name "SE.Live Release Bot"

          # Prepend current relase notes to release notes history.
          #
          # RELEASE_NOTES.md only -- the "What's New" blurb is deliberately NOT archived.
          # It is model-authored prose regenerated per release for the manifest and the
          # GitHub release body; persisting it here would bake it into every future
          # build's notes and grow the history with text nobody wrote. Keep this reading
          # from RELEASE_NOTES.md and never from the composed release_notes_raw.md.

          echo "### ${{ needs.version.outputs.version_string }}" >> /tmp/RELEASE_NOTES.history.md
          echo "" >> /tmp/RELEASE_NOTES.history.md
          cat RELEASE_NOTES.md >> /tmp/RELEASE_NOTES.history.md
          echo "" >> /tmp/RELEASE_NOTES.history.md
          cat RELEASE_NOTES.history.md >> /tmp/RELEASE_NOTES.history.md
          cp /tmp/RELEASE_NOTES.history.md RELEASE_NOTES.history.md

          # clear current release notes

          rm -rf RELEASE_NOTES.md
          touch RELEASE_NOTES.md
          
          # Commit the changes to git

          git add RELEASE_NOTES.md
          git add RELEASE_NOTES.history.md
          git commit -m "[WORKFLOW-AUTOMATION] ${{ needs.version.outputs.version_string }} finalize build"
          git push

      - name: Prune old versions from VirusTotal Monitor
        uses: streamelements/virustotal-monitor-action@v1
        with:
          # The action has no default and reads no environment variable — the key is always
          # passed in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: prune
          managed-prefixes: /obs-streamelements-core
          quota-bytes: ${{ vars.VT_MONITOR_QUOTA_BYTES || '1GiB' }}
          high-watermark: ${{ inputs.high-watermark || vars.VT_MONITOR_HIGH_WATERMARK || '80' }}
          target-watermark: ${{ inputs.target-watermark || vars.VT_MONITOR_TARGET_WATERMARK || '60' }}
          keep-versions: ${{ vars.VT_MONITOR_KEEP_VERSIONS || '3' }}
          # Anything these point at is never deleted. If any of them cannot be fetched, the
          # step fails rather than pruning with an incomplete picture of what is live.
          #
          # Each channel is its own directory holding one obs-streamelements.manifest; signed/
          # additionally pins the most recent signed build. The channels disagree about
          # installer filenames (signed/ uses -<version>.exe and -<version>-64bit.exe, qa/beta/
          # latest use -x86-/-x64-, stable drops the version from the filename entirely), so
          # matching keys off version_number, which all five carry.
          manifest-urls: |
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/qa/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/beta/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/latest/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/stable/obs-streamelements.manifest
          # Public-API allowances by default. A prune walks the tree and deletes per version, so
          # at 4/minute expect a few minutes of wall clock; raise these if the key allows more.
          rate-limit-per-minute: ${{ vars.VT_MONITOR_RATE_PER_MINUTE || '4' }}
          rate-limit-per-day: ${{ vars.VT_MONITOR_RATE_PER_DAY || '500' }}
          rate-limit-per-month: ${{ vars.VT_MONITOR_RATE_PER_MONTH || '15500' }}
          # Scheduled runs default to enforcing; manual runs default to previewing.
          dry-run: false
          # Storage housekeeping must never take a release down with it.
          on-error: warn
          verbose: true
