name: Build

concurrency:
  group: ${{ github.workflow }}-${{ case(startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]'), 'automation', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]') }}
permissions:
  contents: write    # lets GITHUB_TOKEN push tags
  id-token: write    # lets the job mint a GitHub OIDC token for WIF
on:
  push:
    branches:
      - master
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

env:
  BASE_BUILD_NUMBER: 569

  BUILD_OPTIONS: >
    -DENABLE_DECKLINK=OFF
    -DENABLE_SYPHON=OFF
    -DENABLE_LIBFDK=OFF
    -DENABLE_NVENC=OFF
    -DENABLE_QSV11=OFF
    -DENABLE_VST=OFF
    -DENABLE_WEBRTC=OFF
    -DENABLE_WEBSOCKET=OFF
    -DENABLE_OSS=OFF
    -DENABLE_SNDIO=OFF
    -DENABLE_VLC=OFF
    -DENABLE_VIRTUALCAM=OFF
    -DENABLE_TEST_INPUT=OFF
    -DENABLE_AJA=OFF
    -DENABLE_SCRIPTING=OFF
    -DENABLE_SCRIPTING_LUA=OFF
    -DENABLE_UI=OFF

  BUILD_UNINSTALLER: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  BUILD_INSTALLER: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  UPLOAD_SYMBOLS: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}
  UPLOAD_BINARIES: ${{ github.ref == 'refs/heads/master' && github.event_name != 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version_encoded: ${{ steps.version_step.outputs.version_encoded }}
      version_string: ${{ steps.version_step.outputs.version_string }}
      is_workflow_automation: ${{ steps.is_workflow_automation_step.outputs.is_workflow_automation }}
      has_release_notes: ${{ steps.has_release_notes_step.outputs.has_release_notes }}

    steps:
      - name: Generate build number
        uses: mlilback/build-number@v1
        with:
          base: ${{ env.BASE_BUILD_NUMBER }}
          run-id: ${{ github.run_number }}
          # Output: ${{ env.BUILD_NUMBER }} env var

      - name: Generate Version
        id: version_step
        run: |
          echo "BUILD_NUMBER=${{ env.BUILD_NUMBER }}"

          VERSION_ENCODED="$(date '+%Y%m%d')$(printf '%06d' ${{ env.BUILD_NUMBER }})"
          VERSION_STRING="$(date '+%y.%-m.%-d')$(printf '.%d' ${{ env.BUILD_NUMBER }})"

          echo "version_encoded=$VERSION_ENCODED" >> $GITHUB_OUTPUT
          echo "version_string=$VERSION_STRING" >> $GITHUB_OUTPUT

      - name: Check if last commit is result of workflow automation
        id: is_workflow_automation_step
        run: |
          IS_WORKFLOW_AUTOMATION=${{ startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]') }}

          echo "IS_WORKFLOW_AUTOMATION=$IS_WORKFLOW_AUTOMATION"

          echo "is_workflow_automation=$IS_WORKFLOW_AUTOMATION" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4

      - name: Check if RELEASE_NOTES.md has content
        id: has_release_notes_step
        run: |
          if [[ $(grep -c "" RELEASE_NOTES.md) -eq 0 ]]; then
            echo "has_release_notes=false"

            echo "has_release_notes=false" >> $GITHUB_OUTPUT
          else
            echo "has_release_notes=true"

            echo "has_release_notes=true" >> $GITHUB_OUTPUT
          fi
  windows:
    needs: version
    runs-on: windows-2022
    if: needs.version.outputs.is_workflow_automation != 'true'

    env:
      CHECKOUT: 31.1.2
      GS_ACCESS_KEY_ID: ${{ secrets.GS_ACCESS_KEY_ID }}
      GS_KEY_BASE64: ${{ secrets.GS_KEY_BASE64 }}
      GITHUB_WORKSPACE: $GITHUB_WORKSPACE

    steps:
      - uses: actions/checkout@v4

      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Clone OBS Studio
        shell: cmd
        run: |
          mkdir C:\local
          git clone --recursive https://github.com/obsproject/obs-studio.git C:\local\obs-studio
          cd /d C:\local\obs-studio
          git checkout %CHECKOUT%

      - name: Install plugin into OBS tree
        shell: cmd
        run: |
          mkdir C:\local\obs-studio\plugins\obs-streamelements-core
          xcopy "%GITHUB_WORKSPACE%\*.*" "C:\local\obs-studio\plugins\obs-streamelements-core" /S /E /I /Y
          echo add_obs_plugin(obs-streamelements-core) > C:\local\obs-studio\plugins\CMakeLists.txt

      - name: Setup GCS uploader
        shell: powershell
        run: |
          cd C:\local\obs-studio\plugins\obs-streamelements-core\CI\gcs
          [System.Text.Encoding]::UTF8.GetString(
            [System.Convert]::FromBase64String($env:GS_KEY_BASE64)
          ) | Out-File key.json
          npm install

      - name: Download BugSplat uploader
        run: |
          mkdir c:\local\bugsplat

          c:

          cd c:\local\bugsplat

          curl -sL -f -O https://github.com/BugSplat-Git/symbol-upload/releases/download/v10.5.0/symbol-upload-windows.exe

      - name: Generate Version
        shell: powershell
        run: |
          "#define STREAMELEMENTS_PLUGIN_VERSION ${{ needs.version.outputs.version_encoded }}" |
            Out-File C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp

          type C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp

          "STREAMELEMENTS_PLUGIN_VERSION=${{ needs.version.outputs.version_string }}" |
            Out-File $env:GITHUB_ENV -Append

      - name: Configure
        shell: cmd
        run: |
          copy C:\local\obs-studio\plugins\obs-streamelements-core\CMakeUserPresets.json C:\local\obs-studio\CMakeUserPresets.json
          del C:\local\obs-studio\plugins\obs-streamelements-core\CMakeUserPresets.json
          cd /d C:\local\obs-studio
          cmake --preset=windows-x64-streamelements %BUILD_OPTIONS%

      - name: Build
        shell: cmd
        run: |
          cd /d C:\local\obs-studio\build_x64
          msbuild obs-studio.sln -p:Configuration=RelWithDebInfo

      - name: Upload BugSplat Symbols
        if: ${{ env.UPLOAD_SYMBOLS == 'true' }}
        shell: cmd
        run: |
          c:\local\bugsplat\symbol-upload-windows.exe ^
            -v ^
            --clientId "${{ secrets.BUGSPLAT_CLIENTID }}" ^
            --clientSecret "${{ secrets.BUGSPLAT_CLIENTSECRET }}" ^
            --application obs-streamelements-core ^
            --version "${{ needs.version.outputs.version_string }}" ^
            --database OBS_Live ^
            --directory "C:\local\obs-studio\build_x64\rundir\RelWithDebInfo\obs-plugins\64bit" ^
            --files obs-streamelements*.pdb

      - name: Package
        shell: cmd
        run: |
          cd /d C:\local\obs-studio\build_x64\rundir\RelWithDebInfo
          7z a "${{ github.workspace }}/build64_qt6.zip" .

          copy /y C:\local\obs-studio\plugins\obs-streamelements-core\streamelements\Version.generated.hpp "${{ github.workspace }}/Version.generated.hpp"

      - uses: actions/upload-artifact@v4
        with:
          name: build64
          path: '${{ github.workspace }}/build64_qt6.zip'

      - name: Upload 64bit build artifact to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/build64_qt6.zip'
          destination: 'se-obs-builds/obs-streamelements-core/latest/windows'

      - name: Upload version header to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/Version.generated.hpp'
          destination: 'se-obs-builds/obs-streamelements-core/latest/windows'

  macos:
    needs: version
    runs-on: macos-15
    if: needs.version.outputs.is_workflow_automation != 'true'

    env:
      CHECKOUT: 31.1.2
      GS_SECRET_ACCESS_KEY: ${{ secrets.GS_SECRET_ACCESS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Clone OBS Studio
        run: |
          git clone --recursive https://github.com/obsproject/obs-studio.git ~/src/obs-studio
          cd ~/src/obs-studio
          git checkout $CHECKOUT

      - name: Install plugin
        run: |
          cp -R "$GITHUB_WORKSPACE" ~/src/obs-studio/plugins/obs-streamelements-core
          echo "add_obs_plugin(obs-streamelements-core)" >> ~/src/obs-studio/plugins/CMakeLists.txt

      - name: Prepare bugsplat Framework # we store it as a ZIP since on Windows the resulting paths of the unpacked archive are just way too long
        run: |
          cd ~/src/obs-studio/plugins/obs-streamelements-core/deps

          unzip BugSplat.xcframework.zip

      - name: Download BugSplat uploader
        run: |
          cd /tmp
          curl -sL -f -O https://github.com/BugSplat-Git/symbol-upload/releases/download/v10.5.0/symbol-upload-macos
          #cp symbol-upload-macos-intel symbol-upload-macos
          chmod +x symbol-upload-macos

      - name: Generate Version
        run: |
          echo "#define STREAMELEMENTS_PLUGIN_VERSION ${{ needs.version.outputs.version_encoded }}" \
            > ~/src/obs-studio/plugins/obs-streamelements-core/streamelements/Version.generated.hpp

          cat ~/src/obs-studio/plugins/obs-streamelements-core/streamelements/Version.generated.hpp

      - name: Build ARM64
        id: build-arm64
        run: |
          cd ~/src/obs-studio
          cmake --preset=macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -B build_macos_arm64 \
            $BUILD_OPTIONS

          cd build_macos_arm64

          xcodebuild \
            -configuration RelWithDebInfo \
            -scheme obs-streamelements-core \
            -destination "generic/platform=macOS,name=Any Mac"

          cd ~/src/obs-studio/build_macos_arm64/plugins/obs-streamelements-core/RelWithDebInfo

          xcrun dsymutil obs-streamelements-core.plugin/Contents/MacOS/obs-streamelements-core -o obs-streamelements-core.dSYM

      - name: Build x86_64
        id: build-x86_64
        run: |
          cd ~/src/obs-studio
          cmake --preset=macos \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -B build_macos_x86_64 \
            $BUILD_OPTIONS

          cd build_macos_x86_64
          xcodebuild \
            -configuration RelWithDebInfo \
            -scheme obs-streamelements-core \
            -destination "generic/platform=macOS,name=Any Mac"

          cd ~/src/obs-studio/build_macos_x86_64/plugins/obs-streamelements-core/RelWithDebInfo

          xcrun dsymutil obs-streamelements-core.plugin/Contents/MacOS/obs-streamelements-core -o obs-streamelements-core.dSYM

      - name: Upload ARM64 to BugSplat
        if: env.UPLOAD_SYMBOLS == 'true'
        run: |
          cd ~/src/obs-studio/build_macos_arm64/plugins/obs-streamelements-core/RelWithDebInfo

          /tmp/symbol-upload-macos -v -a "obs-streamelements-core-macos" -b "OBS_Live" -i "${{ secrets.BUGSPLAT_CLIENTID }}" -s "${{ secrets.BUGSPLAT_CLIENTSECRET }}" -f "obs-streamelements-core.dSYM" -d . -v "${{ needs.version.outputs.version_encoded }}"

      - name: Upload x86_64 to BugSplat
        if: env.UPLOAD_SYMBOLS == 'true'
        run: |
          cd ~/src/obs-studio/build_macos_x86_64/plugins/obs-streamelements-core/RelWithDebInfo

          /tmp/symbol-upload-macos -v -a "obs-streamelements-core-macos" -b "OBS_Live" -i "${{ secrets.BUGSPLAT_CLIENTID }}" -s "${{ secrets.BUGSPLAT_CLIENTSECRET }}" -f "obs-streamelements-core.dSYM" -d . -v "${{ needs.version.outputs.version_encoded }}"
      - name: Package
        run: |
          cd ~/src/obs-studio/build_macos_arm64/plugins/obs-streamelements-core/RelWithDebInfo
          7z a '${{ github.workspace }}/build_arm64.zip' .

          cd ~/src/obs-studio/build_macos_x86_64/plugins/obs-streamelements-core/RelWithDebInfo
          7z a '${{ github.workspace }}/build_x86_64.zip' .

          cp ~/src/obs-studio/plugins/obs-streamelements-core/streamelements/Version.generated.hpp '${{ github.workspace }}/Version.generated.hpp'

      - uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: |
            build_arm64.zip
            build_x86_64.zip

      - name: Upload ARM64 build artifact to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/build_arm64.zip'
          destination: 'se-obs-builds/obs-streamelements-core/latest/macos'

      - name: Upload x86_64 build artifact to GCS
        if: github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/build_x86_64.zip'
          destination: 'se-obs-builds/obs-streamelements-core/latest/macos'

      - name: Upload version header to GCS
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: '${{ github.workspace }}/Version.generated.hpp'
          destination: 'se-obs-builds/obs-streamelements-core/latest/macos'

  build-uninstaller:
    needs: [ version ]
    if: needs.version.outputs.is_workflow_automation != 'true'
    permissions:
      contents: read
      id-token: write # lets the job mint a GitHub OIDC token for WIF
    uses: ./.github/workflows/build-obs-streamelements-uninstaller.yml
    secrets: inherit
  build-installer:
    needs: [ version, build-uninstaller, windows, macos ]
    if: needs.version.outputs.is_workflow_automation != 'true'
    permissions:
      contents: read
      id-token: write # lets the job mint a GitHub OIDC token for WIF
    uses: ./.github/workflows/build-obs-streamelements-installer.yml
    secrets: inherit
    with:
      SKIP_WINDOWS_SIGNING: ${{ vars.SKIP_WINDOWS_SIGNING }}
      SKIP_APPLE_SIGNING_AND_NOTARIZATION: ${{ vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION }}
      PLUGIN_VERSION_STRING: ${{ needs.version.outputs.version_string }}
      PLUGIN_VERSION_ENCODED: ${{ needs.version.outputs.version_encoded }}

  deploy-signed-windows:
    needs: [ version, windows, build-installer ]
    runs-on: ubuntu-latest
    if: needs.version.outputs.is_workflow_automation != 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (vars.SKIP_WINDOWS_SIGNING != 'true' && vars.SKIP_WINDOWS_SIGNING != '1' && vars.SKIP_WINDOWS_SIGNING != 'yes')

    steps:
      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Create Custom Status Badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: 'Version'
          status: '${{ needs.version.outputs.version_string }}'
          color: 'blue'
          style: 'flat'
          path: '${{ github.workspace }}/version-badge.svg' # Saves the badge image inside your workspace          

      - name: Prepare files
        run: |
          export signedPackageFilename=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}
          export signedPackageFilename64=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}-64bit
          export signedPackageFilename32=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}

          for manifest in obs-streamelements.manifest obs-streamelements.qa.manifest obs-streamelements.beta.manifest obs-streamelements.latest.manifest obs-streamelements.stable.manifest
          do
            curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/$manifest --output $manifest

            sed -i "s/\${PACKAGE_FILENAME}/$signedPackageFilename/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_64_BIT}/$signedPackageFilename64/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_32_BIT}/$signedPackageFilename32/" $manifest

            cat $manifest
          done

          cp obs-streamelements.manifest obs-streamelements-${{ needs.version.outputs.version_encoded }}.manifest

          curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/obs-streamelements-setup.exe --output obs-streamelements-setup.exe
          curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/obs-streamelements-setup-x64.exe --output obs-streamelements-setup-x64.exe
          # curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/windows/obs-streamelements-setup-x86.exe --output obs-streamelements-setup-x86.exe

          cp obs-streamelements-setup-x64.exe ${signedPackageFilename64}.exe
          cp obs-streamelements-setup-x64.exe ${signedPackageFilename32}.exe # This is not a mistake, we no longer support 32bit builds
          mv obs-streamelements-setup.exe ${signedPackageFilename}.exe

          cp version-badge.svg obs-streamelements.version.svg
          cp version-badge.svg obs-streamelements.signed.version.svg
          cp version-badge.svg obs-streamelements.qa.version.svg
          cp version-badge.svg obs-streamelements.beta.version.svg
          cp version-badge.svg obs-streamelements.latest.version.svg
          cp version-badge.svg obs-streamelements.stable.version.svg

          ls *.exe
          ls *.manifest

      - uses: actions/upload-artifact@v4
        with:
          name: windows-signed-installer
          path: |
            *.exe
            *.manifest
            *.version.svg
            *.*.version.svg

      - name: Upload Binaries to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '{*.exe,obs-streamelements.version.svg,obs-streamelements.*.version.svg}'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed'

      - name: Upload Manifests to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '*.manifest'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed'
          headers: |
            content-type: text/plain; charset=utf-8

      - name: Upload signed installers to VirusTotal Monitor
        uses: StreamElements/virustotal-monitor-action@v1
        with:
          # The action has no default and reads no environment variable — the key is always passed
          # in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: upload
          version: ${{ needs.version.outputs.version_encoded }}
          path-prefix: /obs-streamelements-core/windows
          files: |
            ${{ github.workspace }}/obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}.exe
            ${{ github.workspace }}/obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}-64bit.exe
          # Upload failures are loud: a release that AV vendors never see is the problem this solves.
          on-error: fail
          verbose: true

  deploy-signed-macos:
    needs: [ version, macos, build-installer ]
    runs-on: ubuntu-latest
    if: needs.version.outputs.is_workflow_automation != 'true' && github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && (vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION != 'true' && vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION != '1' && vars.SKIP_APPLE_SIGNING_AND_NOTARIZATION != 'yes')

    steps:
      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Create Custom Status Badge
        uses: emibcn/badge-action@v2.0.2
        with:
          label: 'Version'
          status: '${{ needs.version.outputs.version_string }}'
          color: 'blue'
          style: 'flat'
          path: '${{ github.workspace }}/version-badge.svg' # Saves the badge image inside your workspace          

      - name: Prepare files
        run: |
          export signedPackageFilename=obs-streamelements-setup-${{ needs.version.outputs.version_encoded }}

          for manifest in obs-streamelements.manifest obs-streamelements.qa.manifest obs-streamelements.beta.manifest obs-streamelements.latest.manifest obs-streamelements.stable.manifest
          do
            echo "Downloading manifest '$manifest' ..."

            curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/macos/$manifest --output $manifest

            sed -i "s/\${PACKAGE_FILENAME}/$signedPackageFilename/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_64_BIT}/$signedPackageFilename/" $manifest
            sed -i "s/\${PACKAGE_FILENAME_32_BIT}/$signedPackageFilename/" $manifest

            cat $manifest
          done

          cp obs-streamelements.manifest obs-streamelements-${{ needs.version.outputs.version_encoded }}.manifest

          curl -f https://storage.googleapis.com/se-obs-builds/obs-streamelements-installer/latest/macos/obs-streamelements-core.pkg --output ${signedPackageFilename}.pkg

          cp version-badge.svg obs-streamelements.version.svg
          cp version-badge.svg obs-streamelements.signed.version.svg
          cp version-badge.svg obs-streamelements.qa.version.svg
          cp version-badge.svg obs-streamelements.beta.version.svg
          cp version-badge.svg obs-streamelements.latest.version.svg
          cp version-badge.svg obs-streamelements.stable.version.svg

      - uses: actions/upload-artifact@v4
        with:
          name: macos-signed-installer
          path: |
            *.pkg
            *.manifest
          
      - name: Upload Binaries to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '{*.pkg,obs-streamelements.version.svg,obs-streamelements.*.version.svg}'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/macos/signed'

      - name: Upload Manifests to CDN Google Storage
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '*.manifest'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/macos/signed'
          headers: |
            content-type: text/plain; charset=utf-8

  finalize:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: [version, windows, macos, build-uninstaller, build-installer, deploy-signed-macos, deploy-signed-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Tag master commit
        uses: tvdias/github-tagger@v0.0.1
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          tag: "${{ needs.version.outputs.version_string }}"

      - uses: actions/checkout@v4
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        with:
          ssh-key: ${{ secrets.RELEASE_BOT_SSH_KEY }}
      - name: Clear RELEASE_NOTES.md
        if: needs.version.outputs.is_workflow_automation != 'true' && needs.version.outputs.has_release_notes == 'true'
        run: |
          git config --global user.email "release-bot@obs-streamelements-core"
          git config --global user.name "SE.Live Release Bot"

          # Prepend current relase notes to release notes history

          echo "### ${{ needs.version.outputs.version_string }}" >> /tmp/RELEASE_NOTES.history.md
          echo "" >> /tmp/RELEASE_NOTES.history.md
          cat RELEASE_NOTES.md >> /tmp/RELEASE_NOTES.history.md
          echo "" >> /tmp/RELEASE_NOTES.history.md
          cat RELEASE_NOTES.history.md >> /tmp/RELEASE_NOTES.history.md
          cp /tmp/RELEASE_NOTES.history.md RELEASE_NOTES.history.md

          # clear current release notes

          rm -rf RELEASE_NOTES.md
          touch RELEASE_NOTES.md
          
          # Commit the changes to git

          git add RELEASE_NOTES.md
          git add RELEASE_NOTES.history.md
          git commit -m "[WORKFLOW-AUTOMATION] ${{ needs.version.outputs.version_string }} finalize build"
          git push

      - name: Prune old versions from VirusTotal Monitor
        uses: streamelements/virustotal-monitor-action@v1
        with:
          # The action has no default and reads no environment variable — the key is always
          # passed in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: prune
          managed-prefixes: /obs-streamelements-core/windows
          quota-bytes: ${{ vars.VT_MONITOR_QUOTA_BYTES || '1GiB' }}
          high-watermark: ${{ inputs.high-watermark || vars.VT_MONITOR_HIGH_WATERMARK || '80' }}
          target-watermark: ${{ inputs.target-watermark || vars.VT_MONITOR_TARGET_WATERMARK || '60' }}
          keep-versions: ${{ vars.VT_MONITOR_KEEP_VERSIONS || '3' }}
          # Anything these point at is never deleted. If any of them cannot be fetched, the
          # step fails rather than pruning with an incomplete picture of what is live.
          #
          # Each channel is its own directory holding one obs-streamelements.manifest; signed/
          # additionally pins the most recent signed build. The channels disagree about
          # installer filenames (signed/ uses -<version>.exe and -<version>-64bit.exe, qa/beta/
          # latest use -x86-/-x64-, stable drops the version from the filename entirely), so
          # matching keys off version_number, which all five carry.
          manifest-urls: |
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/qa/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/beta/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/latest/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/stable/obs-streamelements.manifest
          # Public-API allowances by default. A prune walks the tree and deletes per version, so
          # at 4/minute expect a few minutes of wall clock; raise these if the key allows more.
          rate-limit-per-minute: ${{ vars.VT_MONITOR_RATE_PER_MINUTE || '4' }}
          rate-limit-per-day: ${{ vars.VT_MONITOR_RATE_PER_DAY || '500' }}
          rate-limit-per-month: ${{ vars.VT_MONITOR_RATE_PER_MONTH || '15500' }}
          # Scheduled runs default to enforcing; manual runs default to previewing.
          dry-run: false
          # Storage housekeeping must never take a release down with it.
          on-error: warn
          verbose: true
