name: Pages

# Publishes two things to GitHub Pages from docs/:
#
#   /              the release-channel status page (docs/status.html), which used
#                  to live at cdn.streamelements.com/obs/qa/status.html as a
#                  single hand-uploaded file, outside version control and review
#   /api/          the JavaScript OBS API reference, built from docs/api/ with
#                  MkDocs Material so it has a nav sidebar and full-text search
#
# Deliberately its own workflow rather than a job in build.yml. build.yml fans out
# to Windows and macOS OBS builds that take tens of minutes and, on master, tags
# and publishes a release; a copy edit to a doc page has no business waiting on
# that, and no business being able to fail it. build.yml's push trigger carries a
# matching paths-ignore so the reverse is also true.
#
# NOTE: this cannot work until a human sets Settings -> Pages -> Source to
# "GitHub Actions". No workflow can flip that switch for itself. actions/configure-pages
# can, via its `enablement` input, but only when handed a token with
# `administration:write` -- a far broader credential than publishing a page is worth.
# Runs before the switch is flipped fail at "Setup Pages" with a 404.

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/pages.yml'
  # Republish without touching the pages. Needed at least once, to deploy after
  # Pages is enabled by hand, rather than pushing an empty commit to master.
  workflow_dispatch:

# Least privilege: publishing a Pages deployment needs no write access to the repo
# at all. `pages: write` creates the deployment, `id-token: write` mints the OIDC
# token that deploy-pages exchanges for the upload credential, and `contents: read`
# is only for the checkout. Strictly less than the `contents: write` a
# gh-pages-branch action needs.
permissions:
  contents: read

# Deliberately unlike build.yml and release.yml, which key the group on the ref and
# cancel in progress. A Pages deployment mutates a live site rather than producing
# an artifact: there is nothing to reclaim by killing one -- the job takes seconds
# -- and a cancel mid-swap is the only way to get a half-deployed site. The group is
# a repo-wide constant, not per-ref, because there is exactly one live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Two jobs, where this workflow previously had one. The split is the reason
  # GitHub's own template has it: this job installs third-party Python packages and
  # runs a generator over them, and it must not be the job holding the Pages
  # publish token. It has `contents: read` and nothing else -- no `pages: write`,
  # no `id-token: write` -- so a compromised dependency cannot deploy anything.
  build:
    name: Build site
    if: github.repository == 'StreamElements/obs-streamelements-core'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pinned, because an unpinned docs toolchain is a supply-chain hole that
      # runs on every push to master. Bump deliberately.
      - name: Install MkDocs Material
        run: pip install --disable-pip-version-check 'mkdocs-material==9.7.7'

      # `strict: true` in mkdocs.yml, with link and anchor validation on. The
      # reference's front page carries 217 generated anchor links into the group
      # pages, so a renamed heading or a moved file fails the build here instead
      # of publishing dead links.
      - name: Build docs/api -> _site/api
        run: mkdocs build

      # Everything else in docs/ is served verbatim at the site root, exactly as
      # before. Copied AFTER the MkDocs build, and with `-n`, so a docs/api change
      # can never overwrite or take down the status page.
      - name: Copy the verbatim pages to the site root
        run: |
          set -euo pipefail
          find docs -maxdepth 1 -type f -print0 |
            xargs -0 -r cp -n -t _site/
          echo "--- site root ---"
          ls -la _site/

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # No .nojekyll marker is needed: Jekyll only runs on the legacy
          # branch-source path, and this tarball is served verbatim.
          path: _site

  deploy:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The only job with the publish token, and it runs nothing but the deploy
    # action against an artifact the previous job produced.
    permissions:
      pages: write
      id-token: write

    # Records the run as a "github-pages" deployment with the live URL attached,
    # so the Environments tab shows what is served and from which commit.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Not strictly required -- deploy-pages works without it -- but it resolves
      # the site's base URL and fails early with a clear message when Pages has not
      # been enabled, instead of failing obscurely at the deploy step. `enablement`
      # stays at its default of false; turning it on would require an admin-scoped
      # credential.
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
