name: Release Signed Binary

concurrency:
  group: ${{ github.workflow }}-${{ case(startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]'), 'automation', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]') }}

permissions:
  contents: write    # lets GITHUB_TOKEN create and edit GitHub Releases
  id-token: write    # lets the job mint a GitHub OIDC token for WIF

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options:
          - windows
          - macos
        required: true
        default: windows

      from:
        type: environment
        required: true
        default: signed
      to:
        type: environment
        required: true
        default: qa

      dry-run:
        type: boolean
        default: true
        required: true

      is-rollback:
        type: boolean
        default: false
        required: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Only two of the five transitions that "Validate Input" permits touch a GitHub
    # release at all. Naming them once here keeps the same boolean out of several `if:`
    # expressions further down.
    #
    #   beta -> latest     a build reaches users: cut the full release (req 1)
    #   stable -> latest   an older build is restored onto `latest`, displacing whatever
    #                      was there: that displaced release goes back to [BETA] (req 11)
    #
    # latest -> beta is deliberately absent. It copies latest's manifest onto `beta` and
    # leaves `latest` serving the same build, so nothing is taken away from users and no
    # release changes.
    env:
      SE_PROMOTE: ${{ github.event.inputs.to == 'latest' && github.event.inputs.is-rollback != 'true' }}
      SE_ROLLBACK: ${{ github.event.inputs.is-rollback == 'true' && github.event.inputs.from == 'stable' && github.event.inputs.to == 'latest' }}

    steps:
      - name: debug
        run: |
          echo "${{ github.event.inputs.platform }}: ${{ github.event.inputs.from }} -> ${{ github.event.inputs.to }}   (dry-run: ${{ github.event.inputs.dry-run }} ${{ github.event.inputs.dry-run == 'true' }})"
      - name: Validate Input
        run: |
          if [ "${{ github.event.inputs.from }}" = "${{ github.event.inputs.to }}" ]; then
            echo "::error::from and to must to be the same"
            exit 1
          fi

          if [ "${{ github.event.inputs.to }}" = "signed" ]; then
            echo "::error::to must never be 'signed'"
            exit 1
          fi

          if [ "${{ github.event.inputs.from }}" = "stable" ]; then
            if [ "${{ github.event.inputs.to }}" != "latest" ]; then
                echo "::error::we can only roll-back from 'stable' to 'latest'"
                exit 1
            fi

            if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::there is nowhere to promote to from 'stable'"
                exit 1
            fi
          elif [ "${{ github.event.inputs.from }}" = "latest" ]; then
            if [ "${{ github.event.inputs.to }}" != "stable" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'latest' to 'stable'"
                exit 1
              elif [ "${{ github.event.inputs.to }}" != "beta" ]; then
                echo "::error::we can only roll-back from 'latest' to 'beta'"
                exit 1
              fi
            fi
          elif [ "${{ github.event.inputs.from }}" = "beta" ]; then
            if [ "${{ github.event.inputs.to }}" != "latest" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'beta' to 'latest'"
                exit 1
              else
                echo "::error::we can never roll-back from 'beta'"
                exit 1
              fi
            fi
          elif [ "${{ github.event.inputs.from }}" = "qa" ]; then
            if [ "${{ github.event.inputs.to }}" != "beta" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'qa' to 'beta'"
                exit 1
              else
                echo "::error::we can never roll-back from 'qa'"
                exit 1
              fi
            fi
          elif [ "${{ github.event.inputs.from }}" = "signed" ]; then
            if [ "${{ github.event.inputs.to }}" != "qa" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'signed' to 'qa'"
                exit 1
              else
                echo "::error::we can never roll-back from 'signed': there is nowhere to roll-back to"
                exit 1
              fi
            fi
          else
              echo "::error::unexpected from value '${{ github.event.inputs.from }}'"
              exit 1
          fi

          echo "::notice::validation passed for transfer from '${{ github.event.inputs.from }}' to '${{ github.event.inputs.to}}' on ${{ github.event.inputs.platform}} (dry-run: ${{ github.event.inputs.dry-run }}; is-rollback: ${{ github.event.inputs.is-rollback }})"

      - uses: actions/checkout@v4
        with:
          # The changelog is `git log <previous full release>..<tag>`, which needs the
          # whole history and every tag. blob:none keeps it cheap: git log never reads
          # file contents, and this repo's .git is ~120 MB.
          fetch-depth: 0
          filter: blob:none

      - name: Auth Google API
        uses: 'google-github-actions/auth@v2'
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Download manifest, version SVG and release notes
        id: download
        run: |
          curl -f --output obs-streamelements.manifest https://cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.from }}/obs-streamelements.manifest

          curl -f --output obs-streamelements.version.svg https://cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.from }}/obs-streamelements.version.svg

          # The release notes travel with the manifest, in both directions, so a channel
          # always serves the notes belonging to the build it points at.
          #
          # When the source has none -- builds predating this file, or a finalize whose
          # upload failed -- a placeholder is synthesised rather than skipping the upload.
          # The manifest and the version SVG are replaced unconditionally, so leaving the
          # destination's previous notes in place would leave it describing a build it no
          # longer points at. Writing the placeholder keeps all three in step.
          if curl -fsS --output obs-streamelements.release_notes.md \
              "https://cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.from }}/obs-streamelements.release_notes.md"; then
            echo "::notice::fetched release notes from '${{ github.event.inputs.from }}'"
            echo "has_release_notes=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::no obs-streamelements.release_notes.md on '${{ github.event.inputs.from }}'; writing a placeholder so '${{ github.event.inputs.to }}' does not keep notes from a different build"
            {
              echo "<!-- SE_RELEASE_NOTES_UNAVAILABLE -->"
              echo
              echo "_No release notes were published for this build._"
            } > obs-streamelements.release_notes.md
            echo "has_release_notes=false" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------------------------------------------------
      # MUST stay above "Upload Manifests to CDN Google Storage". Two independent
      # reasons, and reordering silently breaks both:
      #
      #   promote   with no full release yet, the previous version is bootstrapped from
      #             the live `latest` manifests. After the upload that read returns the
      #             very version being promoted, and the changelog diffs against itself.
      #   rollback  L is the current `latest` manifest's version_number, which the upload
      #             is about to overwrite with S. Read afterwards, `S < L` compares S with
      #             itself and the guard never fires.
      #
      # It also front-loads the "no release for this version" failure, so a promotion
      # that cannot be recorded fails before anything reaches the CDN.
      # ---------------------------------------------------------------------------
      - name: Resolve version, tag and previous full release
        id: version
        if: env.SE_PROMOTE == 'true' || env.SE_ROLLBACK == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: resolve
          github-token: ${{ secrets.GITHUB_TOKEN }}
          manifest: ${{ github.workspace }}/obs-streamelements.manifest
          platform: ${{ github.event.inputs.platform }}
          to: ${{ github.event.inputs.to }}
          is-rollback: ${{ github.event.inputs.is-rollback }}
          output-dir: ${{ github.workspace }}/.release-input

      - name: Build changelog
        if: env.SE_PROMOTE == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: changelog
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          previous-tag: ${{ steps.version.outputs.previous_tag }}
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md

      - name: Upload Manifests to CDN Google Storage
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: 'obs-streamelements.manifest'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.to }}'
          headers: |
            content-type: text/plain; charset=utf-8
            cache-control: 'public, max-age=60'

      # Moves in lockstep with the manifest above, on promotions and rollbacks alike, so
      # every channel serves the notes belonging to the build it is actually pointing at.
      # Same 60s max-age as the manifest for the same reason: a channel's contents can
      # change at any time and stale notes would describe the wrong build.
      #
      # Guarded only on dry-run, exactly like the manifest and SVG uploads. The download
      # step guarantees the file exists -- real notes or a placeholder -- because skipping
      # this upload would leave the destination's previous notes beside a manifest that
      # has moved on.
      - name: Upload release notes to CDN Google Storage
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: 'obs-streamelements.release_notes.md'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.to }}'
          headers: |
            content-type: text/markdown; charset=utf-8
            cache-control: 'public, max-age=60'

      - name: Upload SVGs to CDN Google Storage
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: 'google-github-actions/upload-cloud-storage@v3'
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '{obs-streamelements.version.svg,obs-streamelements.*.version.svg}'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.to }}'
          headers: |
            cache-control: 'no-store, no-cache, must-revalidate'

      - name: Publish GitHub release
        if: env.SE_PROMOTE == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: publish
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          previous-tag: ${{ steps.version.outputs.previous_tag }}
          # The blurb + notes composed at build time, fetched from the source channel
          # above. Reused verbatim, which is why there is no Claude step in this
          # workflow: the text was generated once, when the build was made, and has
          # travelled with the manifest ever since.
          release-notes-file: ${{ github.workspace }}/obs-streamelements.release_notes.md
          # Fallback source, used only when the artifact is absent (builds predating it).
          notes-file: ${{ github.workspace }}/.release-input/notes.md
          # Always recomputed: the range is relative to the previous full release, which
          # can have moved since the build was made.
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md
          dry-run: ${{ github.event.inputs.dry-run }}

      - name: Revert displaced GitHub release
        if: env.SE_ROLLBACK == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: rollback
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          displaced-tag: ${{ steps.version.outputs.displaced_tag }}
          should-revert: ${{ steps.version.outputs.should_revert }}
          dry-run: ${{ github.event.inputs.dry-run }}

      - name: Prune old versions from VirusTotal Monitor
        uses: streamelements/virustotal-monitor-action@v1
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.platform == 'windows' }}
        with:
          # The action has no default and reads no environment variable — the key is always
          # passed in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: prune
          managed-prefixes: /obs-streamelements-core
          quota-bytes: ${{ vars.VT_MONITOR_QUOTA_BYTES || '1GiB' }}
          high-watermark: ${{ inputs.high-watermark || vars.VT_MONITOR_HIGH_WATERMARK || '80' }}
          target-watermark: ${{ inputs.target-watermark || vars.VT_MONITOR_TARGET_WATERMARK || '60' }}
          keep-versions: ${{ vars.VT_MONITOR_KEEP_VERSIONS || '3' }}
          # Anything these point at is never deleted. If any of them cannot be fetched, the
          # step fails rather than pruning with an incomplete picture of what is live.
          #
          # Each channel is its own directory holding one obs-streamelements.manifest; signed/
          # additionally pins the most recent signed build. The channels disagree about
          # installer filenames (signed/ uses -<version>.exe and -<version>-64bit.exe, qa/beta/
          # latest use -x86-/-x64-, stable drops the version from the filename entirely), so
          # matching keys off version_number, which all five carry.
          manifest-urls: |
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/qa/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/beta/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/latest/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/stable/obs-streamelements.manifest
          # Public-API allowances by default. A prune walks the tree and deletes per version, so
          # at 4/minute expect a few minutes of wall clock; raise these if the key allows more.
          rate-limit-per-minute: ${{ vars.VT_MONITOR_RATE_PER_MINUTE || '4' }}
          rate-limit-per-day: ${{ vars.VT_MONITOR_RATE_PER_DAY || '500' }}
          rate-limit-per-month: ${{ vars.VT_MONITOR_RATE_PER_MONTH || '15500' }}
          # Scheduled runs default to enforcing; manual runs default to previewing.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run || 'false' }}
          # Storage housekeeping must never take a release down with it.
          on-error: warn
          verbose: true
