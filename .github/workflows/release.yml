name: Release Signed Binary

concurrency:
  group: ${{ github.workflow }}-${{ case(startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]'), 'automation', github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ !startsWith(github.event.head_commit.message, '[WORKFLOW-AUTOMATION]') }}

permissions:
  contents: write    # lets GITHUB_TOKEN create and edit GitHub Releases
  id-token: write    # lets the job mint a GitHub OIDC token for WIF

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        options:
          - windows
          - macos
        required: true
        default: windows

      from:
        type: environment
        required: true
        default: signed
      to:
        type: environment
        required: true
        default: qa

      dry-run:
        type: boolean
        default: true
        required: true

      linear-dry-run:
        description: >-
          Scan commits and read from Linear, but write nothing to it. Separate from
          dry-run so a real promotion can still leave Linear untouched while the issue
          detection is being validated. A dry-run promotion forces this on regardless.
        type: boolean
        default: true
        required: true

      is-rollback:
        type: boolean
        default: false
        required: true

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    # Which transitions touch a GitHub release. Naming them once here keeps the same
    # booleans out of several `if:` expressions further down.
    #
    #   signed -> qa       the release is CREATED, as a prerelease titled [ALPHA]. This
    #                      is the first time the build exists anywhere but signed/, and
    #                      it is where the installers are attached.
    #   qa -> beta         relabelled [BETA], still a prerelease. Also where the Linear
    #                      release is created and its issues attached.
    #   beta -> latest     a build reaches users: the full release (req 1)
    #   stable -> latest   an older build is restored onto `latest`, displacing whatever
    #                      was there: that displaced release goes back to [BETA] (req 11)
    #
    # build.yml creates nothing. A build that is never promoted has a tag and no release,
    # which is the point: the releases page lists what shipped somewhere rather than
    # every master build that happened to carry notes.
    #
    # latest -> beta is deliberately absent. It copies latest's manifest onto `beta` and
    # leaves `latest` serving the same build, so nothing is taken away from users; the
    # release stays full rather than being relabelled back to [BETA].
    env:
      # Every forward promotion now writes the GitHub release for the version it moves.
      SE_RELEASE_HOP: ${{ (github.event.inputs.to == 'qa' || github.event.inputs.to == 'beta' || github.event.inputs.to == 'latest') && github.event.inputs.is-rollback != 'true' }}
      SE_PROMOTE: ${{ github.event.inputs.to == 'latest' && github.event.inputs.is-rollback != 'true' }}
      SE_ROLLBACK: ${{ github.event.inputs.is-rollback == 'true' && github.event.inputs.from == 'stable' && github.event.inputs.to == 'latest' }}
      SE_LINEAR_BETA: ${{ github.event.inputs.to == 'beta' && github.event.inputs.is-rollback != 'true' }}
      # Skips the Linear steps entirely rather than failing them, so the workflow stays
      # usable in a fork or a clone that has no pipeline access key.
      SE_HAS_LINEAR: ${{ secrets.LINEAR_ACCESS_KEY != '' }}
      # A dry-run promotion must not write to Linear either -- otherwise rehearsing a
      # promotion would leave a real release behind.
      SE_LINEAR_DRY_RUN: ${{ (github.event.inputs.dry-run == 'true' || github.event.inputs.linear-dry-run == 'true') && 'true' || 'false' }}

    steps:
      - name: debug
        run: |
          echo "${{ github.event.inputs.platform }}: ${{ github.event.inputs.from }} -> ${{ github.event.inputs.to }}   (dry-run: ${{ github.event.inputs.dry-run }} ${{ github.event.inputs.dry-run == 'true' }})"
      - name: Validate Input
        run: |
          if [ "${{ github.event.inputs.from }}" = "${{ github.event.inputs.to }}" ]; then
            echo "::error::from and to must to be the same"
            exit 1
          fi

          if [ "${{ github.event.inputs.to }}" = "signed" ]; then
            echo "::error::to must never be 'signed'"
            exit 1
          fi

          if [ "${{ github.event.inputs.from }}" = "stable" ]; then
            if [ "${{ github.event.inputs.to }}" != "latest" ]; then
                echo "::error::we can only roll-back from 'stable' to 'latest'"
                exit 1
            fi

            if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::there is nowhere to promote to from 'stable'"
                exit 1
            fi
          elif [ "${{ github.event.inputs.from }}" = "latest" ]; then
            if [ "${{ github.event.inputs.to }}" != "stable" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'latest' to 'stable'"
                exit 1
              elif [ "${{ github.event.inputs.to }}" != "beta" ]; then
                echo "::error::we can only roll-back from 'latest' to 'beta'"
                exit 1
              fi
            fi
          elif [ "${{ github.event.inputs.from }}" = "beta" ]; then
            if [ "${{ github.event.inputs.to }}" != "latest" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'beta' to 'latest'"
                exit 1
              else
                echo "::error::we can never roll-back from 'beta'"
                exit 1
              fi
            fi
          elif [ "${{ github.event.inputs.from }}" = "qa" ]; then
            if [ "${{ github.event.inputs.to }}" != "beta" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'qa' to 'beta'"
                exit 1
              else
                echo "::error::we can never roll-back from 'qa'"
                exit 1
              fi
            fi
          elif [ "${{ github.event.inputs.from }}" = "signed" ]; then
            if [ "${{ github.event.inputs.to }}" != "qa" ]; then
              if [ "${{ github.event.inputs.is-rollback }}" = "false" ]; then
                echo "::error::we can only promote from 'signed' to 'qa'"
                exit 1
              else
                echo "::error::we can never roll-back from 'signed': there is nowhere to roll-back to"
                exit 1
              fi
            fi
          else
              echo "::error::unexpected from value '${{ github.event.inputs.from }}'"
              exit 1
          fi

          echo "::notice::validation passed for transfer from '${{ github.event.inputs.from }}' to '${{ github.event.inputs.to}}' on ${{ github.event.inputs.platform}} (dry-run: ${{ github.event.inputs.dry-run }}; is-rollback: ${{ github.event.inputs.is-rollback }})"

      - uses: actions/checkout@v4
        with:
          # The changelog is `git log <previous full release>..<tag>`, which needs the
          # whole history and every tag. blob:none keeps it cheap: git log never reads
          # file contents, and this repo's .git is ~120 MB.
          fetch-depth: 0
          filter: blob:none

      - name: Auth Google API
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # v2
        with:
          project_id: streamelements-core
          workload_identity_provider: ${{ vars.GCS_WORKLOAD_ID_PROVIDER }}
          service_account: ${{ vars.GCS_SERVICE_ACCOUNT }}

      - name: Download manifest, version SVG and release notes
        id: download
        run: |
          curl -f --output obs-streamelements.manifest https://cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.from }}/obs-streamelements.manifest

          # The version badge is cosmetic -- it is the image the README embeds -- and it
          # is missing from beta, latest and stable on both platforms. Fetching it with
          # `curl -f` under `bash -e` therefore killed the job before it reached any
          # promotion logic, which blocked beta -> latest, latest -> stable and both
          # rollbacks outright. Its absence must not stop a release from being promoted.
          #
          # Unlike the release notes below, a missing badge cannot be substituted: the
          # notes have a meaningful placeholder, whereas an SVG stating the wrong version
          # would be worse than none. So the upload is skipped instead and the
          # destination keeps whatever badge it had.
          if curl -fsS --output obs-streamelements.version.svg \
              "https://cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.from }}/obs-streamelements.version.svg"; then
            echo "has_version_svg=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::no obs-streamelements.version.svg on '${{ github.event.inputs.from }}'; the version badge on '${{ github.event.inputs.to }}' will not be updated"
            rm -f obs-streamelements.version.svg
            echo "has_version_svg=false" >> $GITHUB_OUTPUT
          fi

          # The release notes travel with the manifest, in both directions, so a channel
          # always serves the notes belonging to the build it points at.
          #
          # When the source has none -- builds predating this file, or a finalize whose
          # upload failed -- a placeholder is synthesised rather than skipping the upload.
          # The manifest and the version SVG are replaced unconditionally, so leaving the
          # destination's previous notes in place would leave it describing a build it no
          # longer points at. Writing the placeholder keeps all three in step.
          if curl -fsS --output obs-streamelements.release_notes.md \
              "https://cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.from }}/obs-streamelements.release_notes.md"; then
            echo "::notice::fetched release notes from '${{ github.event.inputs.from }}'"
            echo "has_release_notes=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::no obs-streamelements.release_notes.md on '${{ github.event.inputs.from }}'; writing a placeholder so '${{ github.event.inputs.to }}' does not keep notes from a different build"
            {
              echo "<!-- SE_RELEASE_NOTES_UNAVAILABLE -->"
              echo
              echo "_No release notes were published for this build._"
            } > obs-streamelements.release_notes.md
            echo "has_release_notes=false" >> $GITHUB_OUTPUT
          fi

      # ---------------------------------------------------------------------------
      # MUST stay above "Upload Manifests to CDN Google Storage". Two independent
      # reasons, and reordering silently breaks both:
      #
      #   promote   with no full release yet, the previous version is bootstrapped from
      #             the live `latest` manifests. After the upload that read returns the
      #             very version being promoted, and the changelog diffs against itself.
      #   rollback  L is the current `latest` manifest's version_number, which the upload
      #             is about to overwrite with S. Read afterwards, `S < L` compares S with
      #             itself and the guard never fires.
      #
      # It no longer front-loads a "no release for this version" failure: on signed -> qa
      # there is deliberately no release yet. That check now lives in the release step,
      # which knows the hop and can still create one; it stays fatal only for `latest`.
      # ---------------------------------------------------------------------------
      - name: Resolve version, tag and previous full release
        id: version
        if: env.SE_RELEASE_HOP == 'true' || env.SE_ROLLBACK == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: resolve
          github-token: ${{ secrets.GITHUB_TOKEN }}
          manifest: ${{ github.workspace }}/obs-streamelements.manifest
          platform: ${{ github.event.inputs.platform }}
          to: ${{ github.event.inputs.to }}
          is-rollback: ${{ github.event.inputs.is-rollback }}
          output-dir: ${{ github.workspace }}/.release-input

      - name: Build changelog
        if: env.SE_RELEASE_HOP == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: changelog
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          previous-tag: ${{ steps.version.outputs.previous_tag }}
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md

      - name: Upload Manifests to CDN Google Storage
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: 'google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a' # v3
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: 'obs-streamelements.manifest'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.to }}'
          headers: |
            content-type: text/plain; charset=utf-8
            cache-control: 'public, max-age=60'

      # Moves in lockstep with the manifest above, on promotions and rollbacks alike, so
      # every channel serves the notes belonging to the build it is actually pointing at.
      # Same 60s max-age as the manifest for the same reason: a channel's contents can
      # change at any time and stale notes would describe the wrong build.
      #
      # Guarded only on dry-run, exactly like the manifest and SVG uploads. The download
      # step guarantees the file exists -- real notes or a placeholder -- because skipping
      # this upload would leave the destination's previous notes beside a manifest that
      # has moved on.
      - name: Upload release notes to CDN Google Storage
        if: ${{ github.event.inputs.dry-run == 'false' }}
        uses: 'google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a' # v3
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: 'obs-streamelements.release_notes.md'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.to }}'
          headers: |
            content-type: text/markdown; charset=utf-8
            cache-control: 'public, max-age=60'

      # Conditional, unlike the manifest and release notes above: when the source channel
      # has no badge there is nothing meaningful to publish, and an empty glob would fail
      # the upload action.
      - name: Upload SVGs to CDN Google Storage
        if: ${{ github.event.inputs.dry-run == 'false' && steps.download.outputs.has_version_svg == 'true' }}
        uses: 'google-github-actions/upload-cloud-storage@6397bd7208e18d13ba2619ee21b9873edc94427a' # v3
        with:
          parent: false
          process_gcloudignore: false
          path: ${{ github.workspace }}
          glob: '{obs-streamelements.version.svg,obs-streamelements.*.version.svg}'
          destination: 'cdn.streamelements.com/obs/dist/obs-streamelements/${{ github.event.inputs.platform }}/${{ github.event.inputs.to }}'
          headers: |
            cache-control: 'no-store, no-cache, must-revalidate'

      # The GitHub release follows the channel, not the build. build.yml creates none:
      #
      #   signed -> qa      created as a prerelease titled '[ALPHA] <tag>'
      #   qa -> beta        relabelled '[BETA] <tag>', still a prerelease
      #   beta -> latest    titled '<tag>', full release, Latest
      #
      # Convergent at every hop, which matters because each version is promoted twice --
      # once per platform. The second pass finds the release already in the right state
      # and only re-asserts its title.
      - name: Write the GitHub release for this channel
        if: env.SE_RELEASE_HOP == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: release
          to: ${{ github.event.inputs.to }}
          # Also makes the step write release-body.md here, which the Linear release
          # below reuses so both descriptions are the same bytes.
          output-dir: ${{ github.workspace }}/.release-input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          previous-tag: ${{ steps.version.outputs.previous_tag }}
          # The blurb + notes composed at build time, fetched from the source channel
          # above. Reused verbatim, which is why there is no Claude step in this
          # workflow: the text was generated once, when the build was made, and has
          # travelled with the manifest ever since.
          release-notes-file: ${{ github.workspace }}/obs-streamelements.release_notes.md
          # Fallback source, used only when the artifact is absent (builds predating it).
          notes-file: ${{ github.workspace }}/.release-input/notes.md
          # Always recomputed: the range is relative to the previous full release, which
          # can have moved since the build was made.
          changelog-file: ${{ github.workspace }}/.release-input/changelog.md
          dry-run: ${{ github.event.inputs.dry-run }}

      # Attach the signed installers, on the hop that creates the release. Moved here
      # from build.yml with the release itself.
      #
      # Read from signed/ rather than from the destination channel, because that is
      # where the installers this version was built as actually live. The channel is a
      # moving pointer, so attach-assets.sh refuses to attach when signed/ has since
      # moved on to a newer build -- shipping someone else's binaries under this tag
      # would be worse than shipping none.
      #
      # Only on the qa hop: later promotions would find signed/ further ahead and skip
      # anyway, and the assets are already on the release by then.
      #
      # Best-effort: a failure here leaves the release valid, just without binaries.
      - name: Attach installers to the release
        if: env.SE_RELEASE_HOP == 'true' && github.event.inputs.to == 'qa'
        continue-on-error: true
        uses: ./.github/actions/se-release
        with:
          mode: assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          version-encoded: ${{ steps.version.outputs.version_encoded }}
          dry-run: ${{ github.event.inputs.dry-run }}

      - name: Revert displaced GitHub release
        if: env.SE_ROLLBACK == 'true'
        uses: ./.github/actions/se-release
        with:
          mode: rollback
          github-token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.version.outputs.version_string }}
          displaced-tag: ${{ steps.version.outputs.displaced_tag }}
          should-revert: ${{ steps.version.outputs.should_revert }}
          dry-run: ${{ github.event.inputs.dry-run }}

      # ---------------------------------------------------------------------------
      # Linear release tracking. The Linear release now follows the channel exactly as
      # the GitHub release does, one stage per hop:
      #
      #   signed -> qa      create the release, named for the version, with the same
      #                     body as the GitHub release, at stage "In Progress"
      #   qa -> beta        stage -> "Open Beta"          (vars.LINEAR_BETA_STAGE)
      #   beta -> latest    complete it, which is what moves a scheduled pipeline to its
      #                     completed stage, "Released"
      #
      # and on the two rollbacks:
      #
      #   stable -> latest  the DISPLACED release goes back to "Open Beta"; the restored
      #                     one is completed, mirroring what the GitHub rollback does
      #   latest -> beta    stage -> "In Progress"
      #
      # Everything is continue-on-error. Issue bookkeeping must never hold up a
      # promotion, least of all during an incident.
      #
      # Issue detection moved to the qa hop with creation. Linear keys do not appear in
      # this repo's commit subjects -- master is squash-merged, so subjects read
      # `feat(ci): ... (#93)` and the branch name that carried the key is gone. The CLI
      # bridges that by resolving the `(#93)` reference to its pull request and reading
      # the issues Linear linked to it, which works only for PRs whose branch carried a
      # key. issue_pattern is additive and catches keys written into a subject by hand.
      # ---------------------------------------------------------------------------
      - name: Check out the promoted build
        id: linear_checkout
        if: env.SE_HAS_LINEAR == 'true' && (env.SE_RELEASE_HOP == 'true' || env.SE_ROLLBACK == 'true')
        continue-on-error: true
        env:
          TAG: ${{ steps.version.outputs.version_string }}
        run: |
          # The commit scan is relative to HEAD, and HEAD is master -- which has moved on
          # since this build was made. Detach onto the tag so the range is the one that
          # was actually promoted.
          if git rev-parse -q --verify "refs/tags/$TAG^{commit}" > /dev/null; then
            git checkout --detach --quiet "refs/tags/$TAG"
            echo "ok=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::tag $TAG is not present in this clone; skipping the Linear sync"
            echo "ok=false" >> $GITHUB_OUTPUT
          fi

      # Only `sync` creates a release or sets its version; `update` and `complete`
      # strictly look one up and fail if it is absent. So this must run on the hop that
      # creates -- signed -> qa -- and it is also the only hop that scans commits.
      - name: Create the Linear release
        id: linear_sync
        if: env.SE_HAS_LINEAR == 'true' && env.SE_RELEASE_HOP == 'true' && github.event.inputs.to == 'qa' && steps.linear_checkout.outputs.ok == 'true'
        continue-on-error: true
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: sync
          # Version and name are both the dotted build version. Passing the version
          # explicitly at every hop is what lets the later ones select this release.
          version: ${{ steps.version.outputs.version_string }}
          name: ${{ steps.version.outputs.version_string }}
          # Byte-identical to the GitHub release body: the release step above writes the
          # body it published to this path, so the two cannot drift.
          release_notes: ${{ github.workspace }}/.release-input/release-body.md
          # Empty when the previous version on this channel is unknown or untagged, in
          # which case the CLI falls back to its own scan base.
          base_ref: ${{ steps.version.outputs.previous_channel_tag }}
          links: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version_string }}
          # Additive to the CLI's built-in detection, and scoped to the team prefix so it
          # contributes nothing but CORE keys. It does not suppress the built-in subject
          # scan, which is broader: the first dry-run over this range reported an issue
          # named UTF-8, matched out of `fix: UTF-8 output into manifests`. That is
          # cosmetic -- identifiers absent from the workspace are ignored server-side --
          # and it is not something this input can turn off.
          issue_pattern: ${{ vars.LINEAR_ISSUE_PATTERN || '\b(CORE-[0-9]+)\b' }}
          dry_run: ${{ env.SE_LINEAR_DRY_RUN }}
          log_level: verbose

      # A newly synced release sits in the pipeline's planned stage, so qa has to move it
      # to In Progress explicitly.
      - name: Move the Linear release to In Progress
        if: env.SE_HAS_LINEAR == 'true' && env.SE_RELEASE_HOP == 'true' && github.event.inputs.to == 'qa' && steps.linear_sync.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: update
          version: ${{ steps.version.outputs.version_string }}
          stage: ${{ vars.LINEAR_INPROGRESS_STAGE || 'In Progress' }}
          dry_run: ${{ env.SE_LINEAR_DRY_RUN }}
          log_level: verbose

      # Skipped when LINEAR_BETA_STAGE is unset, so a workspace without that stage keeps
      # the release on In Progress rather than failing the promotion.
      - name: Move the Linear release to the beta stage
        if: env.SE_HAS_LINEAR == 'true' && env.SE_RELEASE_HOP == 'true' && github.event.inputs.to == 'beta' && vars.LINEAR_BETA_STAGE != ''
        continue-on-error: true
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: update
          version: ${{ steps.version.outputs.version_string }}
          stage: ${{ vars.LINEAR_BETA_STAGE }}
          dry_run: ${{ env.SE_LINEAR_DRY_RUN }}
          log_level: verbose

      # `complete` rather than `update --stage=Released`: for a scheduled pipeline that
      # is what moves a release into the completed stage, and it is the only path that
      # fires the pipeline's autoGenerateReleaseNotesOnCompletion and
      # rolloverIssuesOnCompletion settings, both of which are on.
      - name: Complete the Linear release
        id: linear_complete
        if: env.SE_HAS_LINEAR == 'true' && (env.SE_PROMOTE == 'true' || env.SE_ROLLBACK == 'true')
        continue-on-error: true
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: complete
          version: ${{ steps.version.outputs.version_string }}
          dry_run: ${{ env.SE_LINEAR_DRY_RUN }}
          log_level: verbose

      # A stable -> latest rollback puts an older build back in front of users, so the
      # release it displaces stops being released. It goes back to the beta stage rather
      # than to In Progress: it was on beta before it was promoted, and should_revert is
      # already false whenever the other platform still serves it.
      - name: Move the displaced Linear release back to the beta stage
        if: env.SE_HAS_LINEAR == 'true' && env.SE_ROLLBACK == 'true' && steps.version.outputs.should_revert == 'true' && steps.version.outputs.displaced_tag != '' && vars.LINEAR_BETA_STAGE != ''
        continue-on-error: true
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: update
          version: ${{ steps.version.outputs.displaced_tag }}
          stage: ${{ vars.LINEAR_BETA_STAGE }}
          dry_run: ${{ env.SE_LINEAR_DRY_RUN }}
          log_level: verbose

      # latest -> beta is only ever reached as a rollback -- "Validate Input" rejects it
      # as a promotion. The build is being taken away from everyone, so its release goes
      # back to In Progress rather than to the beta stage.
      - name: Move the Linear release back to In Progress
        if: env.SE_HAS_LINEAR == 'true' && github.event.inputs.is-rollback == 'true' && github.event.inputs.from == 'latest' && github.event.inputs.to == 'beta'
        continue-on-error: true
        uses: linear/linear-release-action@17b8c24f8ceb2b98cabaf1965ff83c55dd596fac # v0
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          command: update
          version: ${{ steps.version.outputs.version_string }}
          stage: ${{ vars.LINEAR_INPROGRESS_STAGE || 'In Progress' }}
          dry_run: ${{ env.SE_LINEAR_DRY_RUN }}
          log_level: verbose

      # Cancel whatever is still open behind the release that just shipped.
      #
      # A build can reach `latest` while older builds are still sitting on In Progress or
      # Open Beta -- they were promoted to qa or beta and then overtaken. Those releases
      # will never ship, and leaving them open makes the pipeline read as though several
      # versions are in flight at once.
      #
      # This is a script rather than more `uses:` steps because the set is dynamic and an
      # action step cannot loop. The CLI has no list command either, so the candidates are
      # derived from tags instead: every version tag strictly between the previous full
      # release and this one. Anything older than the previous full release was already
      # completed or cancelled when that one shipped, so the window is exactly right.
      #
      # `update` errors on a version with no release, which is the common case here --
      # most tagged builds are never promoted. Those failures are expected and swallowed
      # per version; only the count is reported.
      - name: Cancel releases left open behind this one
        if: env.SE_HAS_LINEAR == 'true' && env.SE_PROMOTE == 'true' && steps.linear_complete.outcome == 'success'
        continue-on-error: true
        env:
          LINEAR_ACCESS_KEY: ${{ secrets.LINEAR_ACCESS_KEY }}
          TAG: ${{ steps.version.outputs.version_string }}
          PREV: ${{ steps.version.outputs.previous_tag }}
          CANCEL_STAGE: ${{ vars.LINEAR_CANCELED_STAGE || 'Canceled' }}
          DRY: ${{ env.SE_LINEAR_DRY_RUN }}
          # Pinned to the version linear-release-action installs by default, so both
          # paths speak to Linear through the same CLI.
          CLI_VERSION: v0.15.0
        run: |
          set -euo pipefail

          if [ -z "$PREV" ]; then
            echo "::warning::no previous full release, so the range of possibly-open releases is unbounded; skipping the cancel sweep"
            exit 0
          fi

          # The build number is the last dotted component and is a global monotonic
          # counter, which makes it a truer order than the yy.m.d prefix -- that has at
          # least one bogus entry (tag 15.12.15.535 sorts wrong by date but right by
          # build number).
          build_of() { printf '%s\n' "${1##*.}"; }
          cur=$(build_of "$TAG")
          low=$(build_of "$PREV")
          echo "::notice::cancel sweep: releases with build numbers strictly between $low ($PREV) and $cur ($TAG)"

          curl -fsSL "https://github.com/linear/linear-release/releases/download/$CLI_VERSION/linear-release-linux-x64" -o linear-release
          chmod +x linear-release

          cancelled=0
          absent=0
          for t in $(git tag --list '[0-9]*.[0-9]*.[0-9]*.[0-9]*' | sort -t. -k4,4n); do
            b=$(build_of "$t")
            case "$b" in '' | *[!0-9]*) continue ;; esac
            [ "$b" -gt "$low" ] || continue
            [ "$b" -lt "$cur" ] || continue

            args="update --stage=$CANCEL_STAGE --release-version=$t --quiet"
            [ "$DRY" = 'true' ] && args="$args --dry-run"
            # shellcheck disable=SC2086
            if ./linear-release $args > /dev/null 2>&1; then
              echo "  cancelled $t"
              cancelled=$((cancelled + 1))
            else
              absent=$((absent + 1))
            fi
          done

          rm -f linear-release
          echo "::notice::cancel sweep: $cancelled release(s) moved to '$CANCEL_STAGE', $absent tag(s) had no release (dry-run: $DRY)"

      # Submitting the signed installers to VirusTotal Monitor, moved here from
      # build.yml's deploy-signed-windows job.
      #
      # Uploading at build time submitted every master build, including ones never
      # promoted to a channel any user sees. Doing it on promotion means the binaries AV
      # vendors are shown are the ones actually being shipped, and it puts the upload
      # immediately before the prune below, so the version being added is counted by the
      # same watermark pass that decides what to delete.
      #
      # Both the version key and the two installer URLs are read out of the manifest
      # downloaded above rather than reconstructed. The channels disagree about installer
      # filenames -- signed/ uses -<version>.exe and -<version>-64bit.exe, qa/beta/latest
      # use -x86-/-x64-, stable drops the version entirely -- but every manifest carries
      # package_url, package_url_64 and version_number. version_number is also what the
      # prune matches on, so the keys stay consistent with everything build.yml submitted
      # before this moved.
      #
      # Only on signed -> qa, the first hop a build takes and the point it stops being
      # purely internal. Every later promotion moves the same bytes, so firing on any
      # non-dry-run Windows promotion would submit one release four times over and spend
      # the rate limits documented on the prune below for nothing. is-rollback needs no
      # mention: "Validate Input" above rejects `to == signed` outright and allows no
      # transition out of `signed` other than to `qa`, so this pair is only ever a
      # forward promotion.
      #
      # The prune below deliberately keeps the wider gate: housekeeping should run on
      # every promotion regardless of whether this hop submitted anything.
      - name: Download signed installers for VirusTotal
        id: vt_installers
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.platform == 'windows'
          && github.event.inputs.from == 'signed' && github.event.inputs.to == 'qa' }}
        run: |
          set -euo pipefail

          # The manifest is CRLF, so every value is stripped before use; a trailing
          # carriage return silently corrupts both the URLs and the version key.
          read_field() {
            sed -n "s/^$1=//p" obs-streamelements.manifest | tr -d '\r' | head -1
          }

          version_number="$(read_field version_number)"
          url_32="$(read_field package_url)"
          url_64="$(read_field package_url_64)"

          if [ -z "$version_number" ] || [ -z "$url_32" ] || [ -z "$url_64" ]; then
            echo "::error::manifest on '${{ github.event.inputs.from }}' is missing version_number, package_url or package_url_64; cannot submit to VirusTotal"
            exit 1
          fi

          # Keep the CDN's filenames: they are what shows up in VirusTotal Monitor, and
          # renaming them would make a promoted build look unrelated to what build.yml
          # used to submit. The query string is a cache-buster and is dropped.
          name_32="$(basename "${url_32%%\?*}")"
          name_64="$(basename "${url_64%%\?*}")"

          curl -fsS --output "$name_32" "$url_32"
          curl -fsS --output "$name_64" "$url_64"

          echo "version_number=$version_number" >> "$GITHUB_OUTPUT"
          echo "file_32=$name_32" >> "$GITHUB_OUTPUT"
          echo "file_64=$name_64" >> "$GITHUB_OUTPUT"

          echo "::notice::submitting $name_32 and $name_64 (version $version_number) to VirusTotal Monitor"

      - name: Upload signed installers to VirusTotal Monitor
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.platform == 'windows'
          && github.event.inputs.from == 'signed' && github.event.inputs.to == 'qa' }}
        uses: StreamElements/virustotal-monitor-action@v1
        with:
          # The action has no default and reads no environment variable — the key is always
          # passed in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: upload
          version: ${{ steps.vt_installers.outputs.version_number }}
          path-prefix: /obs-streamelements-core/windows
          files: |
            ${{ github.workspace }}/${{ steps.vt_installers.outputs.file_32 }}
            ${{ github.workspace }}/${{ steps.vt_installers.outputs.file_64 }}
          # Upload failures are loud: a release AV vendors never see is the problem this solves.
          on-error: fail
          verbose: true

      - name: Prune old versions from VirusTotal Monitor
        uses: StreamElements/virustotal-monitor-action@v1
        if: ${{ github.event.inputs.dry-run == 'false' && github.event.inputs.platform == 'windows' }}
        with:
          # The action has no default and reads no environment variable — the key is always
          # passed in. Point this at whatever your repo or org calls the secret.
          api-key: ${{ secrets.VT_MONITOR_API_KEY }}
          mode: prune
          managed-prefixes: /obs-streamelements-core
          quota-bytes: ${{ vars.VT_MONITOR_QUOTA_BYTES || '1GiB' }}
          high-watermark: ${{ inputs.high-watermark || vars.VT_MONITOR_HIGH_WATERMARK || '80' }}
          target-watermark: ${{ inputs.target-watermark || vars.VT_MONITOR_TARGET_WATERMARK || '60' }}
          keep-versions: ${{ vars.VT_MONITOR_KEEP_VERSIONS || '3' }}
          # Anything these point at is never deleted. If any of them cannot be fetched, the
          # step fails rather than pruning with an incomplete picture of what is live.
          #
          # Each channel is its own directory holding one obs-streamelements.manifest; signed/
          # additionally pins the most recent signed build. The channels disagree about
          # installer filenames (signed/ uses -<version>.exe and -<version>-64bit.exe, qa/beta/
          # latest use -x86-/-x64-, stable drops the version from the filename entirely), so
          # matching keys off version_number, which all five carry.
          manifest-urls: |
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/signed/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/qa/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/beta/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/latest/obs-streamelements.manifest
            https://cdn.streamelements.com/obs/dist/obs-streamelements/windows/stable/obs-streamelements.manifest
          # Public-API allowances by default. A prune walks the tree and deletes per version, so
          # at 4/minute expect a few minutes of wall clock; raise these if the key allows more.
          rate-limit-per-minute: ${{ vars.VT_MONITOR_RATE_PER_MINUTE || '4' }}
          rate-limit-per-day: ${{ vars.VT_MONITOR_RATE_PER_DAY || '500' }}
          rate-limit-per-month: ${{ vars.VT_MONITOR_RATE_PER_MONTH || '15500' }}
          # Scheduled runs default to enforcing; manual runs default to previewing.
          dry-run: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry-run || 'false' }}
          # Storage housekeeping must never take a release down with it.
          on-error: warn
          verbose: true
